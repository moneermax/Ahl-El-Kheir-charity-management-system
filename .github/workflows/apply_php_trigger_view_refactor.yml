name: One-time PHP trigger/view refactor

on:
  push:
    branches:
      - refactor/php-trigger-view-migration

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4

      - name: Apply PHP data-integrity refactor
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path.cwd()

          helper = r'''<?php
declare(strict_types=1);

/**
 * Application-owned data-integrity rules.
 *
 * Replaces the former MySQL family/child/supervisor triggers with explicit
 * procedural PHP business logic. All database access uses the project's PDO
 * helper functions and real schema names.
 */

if (!function_exists('ak_sync_family_children_count')) {
    function ak_sync_family_children_count(int $familyId): void
    {
        if ($familyId <= 0) return;

        dbExecute(
            "UPDATE families
             SET children_count = (
                 SELECT COUNT(*) FROM family_children WHERE family_id = ?
             )
             WHERE id = ?",
            [$familyId, $familyId]
        );
    }
}

if (!function_exists('ak_sync_all_family_children_counts')) {
    function ak_sync_all_family_children_counts(): void
    {
        dbExecute(
            "UPDATE families f
             SET f.children_count = (
                 SELECT COUNT(*) FROM family_children fc
                 WHERE fc.family_id = f.id
             )"
        );
    }
}

if (!function_exists('ak_supervisor_gender_normalize')) {
    function ak_supervisor_gender_normalize(?string $raw): string
    {
        $v = strtolower(trim((string)$raw));
        if (in_array($v, ['female', 'f', 'أنثى', 'انثى'], true)) return 'female';
        if (in_array($v, ['male', 'm', 'ذكر'], true)) return 'male';
        return '';
    }
}

if (!function_exists('ak_get_supervisor_matrix')) {
    function ak_get_supervisor_matrix(): array
    {
        $matrix = [];

        foreach (dbFetchAll(
            "SELECT sl.letter_id, sl.supervisor_id, sl.gender
             FROM supervisor_letters sl
             WHERE sl.supervisor_id IS NOT NULL"
        ) as $row) {
            $letterId = (int)$row['letter_id'];
            $supervisorId = (int)$row['supervisor_id'];
            if ($letterId <= 0 || $supervisorId <= 0) continue;

            $gender = ak_supervisor_gender_normalize($row['gender'] ?? null);
            if ($gender === '') {
                // Legacy NULL/unknown/'both' rows own both genders.
                $matrix[$letterId]['male'] = $supervisorId;
                $matrix[$letterId]['female'] = $supervisorId;
                $matrix[$letterId]['legacy'] = $supervisorId;
            } else {
                $matrix[$letterId][$gender] = $supervisorId;
            }
        }

        return $matrix;
    }
}

if (!function_exists('ak_resolve_sponsor_supervisor')) {
    function ak_resolve_sponsor_supervisor(?int $letterId, ?string $gender, array $matrix): ?int
    {
        if (!$letterId || !isset($matrix[$letterId])) return null;

        $g = ak_supervisor_gender_normalize($gender);
        if ($g !== '') {
            if (isset($matrix[$letterId][$g])) return (int)$matrix[$letterId][$g];
            if (isset($matrix[$letterId]['legacy'])) return (int)$matrix[$letterId]['legacy'];
            return null;
        }

        foreach (['legacy', 'male', 'female'] as $candidate) {
            if (isset($matrix[$letterId][$candidate])) return (int)$matrix[$letterId][$candidate];
        }

        return null;
    }
}

if (!function_exists('ak_sync_non_manual_sponsor_supervisors')) {
    function ak_sync_non_manual_sponsor_supervisors(?int $sponsorId = null): void
    {
        $params = [];
        $where = "COALESCE(s.is_manual_override, 0) = 0";

        if ($sponsorId !== null && $sponsorId > 0) {
            $where .= " AND s.id = ?";
            $params[] = $sponsorId;
        }

        $sponsors = dbFetchAll(
            "SELECT s.id, s.first_letter_id, s.gender
             FROM sponsors s
             WHERE {$where}
             ORDER BY s.id",
            $params
        );

        if (!$sponsors) return;

        $matrix = ak_get_supervisor_matrix();

        foreach ($sponsors as $sponsor) {
            $resolved = ak_resolve_sponsor_supervisor(
                isset($sponsor['first_letter_id']) ? (int)$sponsor['first_letter_id'] : null,
                $sponsor['gender'] ?? null,
                $matrix
            );

            dbExecute(
                "UPDATE sponsors
                 SET supervisor_id = ?
                 WHERE id = ? AND COALESCE(is_manual_override, 0) = 0",
                [$resolved, (int)$sponsor['id']]
            );
        }
    }
}
'''

          (root / 'config' / 'data_integrity.php').write_text(helper, encoding='utf-8', newline='\n')

          fp = root / 'config' / 'functions.php'
          text = fp.read_text(encoding='utf-8')
          if "require_once __DIR__ . '/data_integrity.php';" not in text:
              needle = "/* ---------- centralized global-search authorization ---------- */"
              if needle not in text:
                  raise SystemExit('Could not locate insertion point in config/functions.php')
              text = text.replace(needle, "require_once __DIR__ . '/data_integrity.php';\n\n" + needle, 1)
              fp.write_text(text, encoding='utf-8', newline='\n')

          fp = root / 'modules' / 'families' / 'edit.php'
          text = fp.read_text(encoding='utf-8')
          if 'ak_sync_family_children_count($id)' not in text:
              needle = "$id = (int)($_GET['id'] ?? $_POST['id'] ?? 0);"
              if needle not in text:
                  raise SystemExit('Could not locate family edit id initialization')
              insert = needle + "\nregister_shutdown_function(static function () use ($id): void {\n    if ($id > 0 && function_exists('ak_sync_family_children_count')) {\n        try {\n            ak_sync_family_children_count($id);\n        } catch (Throwable $e) {\n            error_log('Family children count sync: ' . $e->getMessage());\n        }\n    }\n});"
              text = text.replace(needle, insert, 1)
              fp.write_text(text, encoding='utf-8', newline='\n')

          fp = root / 'modules' / 'supervisors' / 'assign-letters.php'
          text = fp.read_text(encoding='utf-8')
          if 'ak_sync_non_manual_sponsor_supervisors' not in text:
              needle = "$highlightId = (int)($_GET['supervisor'] ?? 0);"
              if needle not in text:
                  raise SystemExit('Could not locate supervisor highlight initialization')
              insert = needle + "\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    register_shutdown_function(static function (): void {\n        if (function_exists('ak_sync_non_manual_sponsor_supervisors')) {\n            try {\n                ak_sync_non_manual_sponsor_supervisors();\n            } catch (Throwable $e) {\n                error_log('Supervisor sponsor sync: ' . $e->getMessage());\n            }\n        }\n    });\n}"
              text = text.replace(needle, insert, 1)
              fp.write_text(text, encoding='utf-8', newline='\n')

          # Remove the legacy trigger/view definitions from the checked-in SQL dump.
          sqlp = root / 'database' / 'ahl_el_kheir.sql'
          sql = sqlp.read_text(encoding='utf-8')

          trigger_names = [
              'trg_families_family_code_ai', 'trg_families_family_code_bu',
              'trg_family_children_ai', 'trg_family_children_au', 'trg_family_children_ad',
              'trg_supervisor_letters_ai', 'trg_supervisor_letters_au', 'trg_supervisor_letters_ad',
          ]
          for name in trigger_names:
              pattern = re.compile(
                  r'(?is)(?:--[^\n]*\n)*\s*CREATE\s+TRIGGER\s+`?' + re.escape(name) +
                  r'`?.*?END\$\$\s*\n?'
              )
              sql, n = pattern.subn('', sql, count=1)
              if n == 0:
                  pattern2 = re.compile(
                      r'(?is)CREATE\s+TRIGGER\s+`?' + re.escape(name) + r'`?.*?;\s*'
                  )
                  sql = pattern2.sub('', sql, count=1)

          view_names = [
              'vw_families_without_sponsorship',
              'vw_sponsor_current_supervisor',
              'vw_supervisor_sponsors',
          ]
          for name in view_names:
              pattern = re.compile(
                  r'(?is)(?:--[^\n]*\n)*\s*CREATE\s+(?:ALGORITHM=.*?\s+)?VIEW\s+`?' +
                  re.escape(name) + r'`?.*?;\s*'
              )
              sql, _ = pattern.subn('', sql, count=1)

          sqlp.write_text(sql, encoding='utf-8', newline='\n')

          # Disable this one-time workflow after the first successful run.
          wf = root / '.github' / 'workflows' / 'apply_php_trigger_view_refactor.yml'
          wf_text = wf.read_text(encoding='utf-8')
          wf_text = wf_text.replace(
              "on:\n  push:\n    branches:\n      - refactor/php-trigger-view-migration",
              "on:\n  workflow_dispatch:"
          )
          wf.write_text(wf_text, encoding='utf-8', newline='\n')

      - name: Validate PHP syntax
        shell: bash
        run: |
          php -l config/data_integrity.php
          php -l config/functions.php
          php -l modules/families/edit.php
          php -l modules/supervisors/assign-letters.php

      - name: Verify legacy trigger/view names are absent
        shell: bash
        run: |
          ! grep -R -n -E 'trg_families_family_code_ai|trg_families_family_code_bu|trg_family_children_ai|trg_family_children_au|trg_family_children_ad|trg_supervisor_letters_ai|trg_supervisor_letters_au|trg_supervisor_letters_ad|vw_families_without_sponsorship|vw_sponsor_current_supervisor|vw_supervisor_sponsors' database/ahl_el_kheir.sql modules config

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/data_integrity.php config/functions.php modules/families/edit.php modules/supervisors/assign-letters.php database/ahl_el_kheir.sql .github/workflows/apply_php_trigger_view_refactor.yml
          git diff --cached --quiet || git commit -m "refactor: move integrity rules from DB triggers to PHP"
          git push origin HEAD:refactor/php-trigger-view-migration
