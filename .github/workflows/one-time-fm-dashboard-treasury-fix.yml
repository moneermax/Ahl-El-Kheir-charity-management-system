name: One-time FM dashboard treasury fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch FM dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('modules/accounting/fm_dashboard.php')
          s = p.read_text(encoding='utf-8')

          old_php = '''$treasury = dbFetchOne("SELECT
              COALESCE(SUM(CASE WHEN a.code = '1100' THEN jl.debit - jl.credit ELSE 0 END), 0) AS cash,
              COALESCE(SUM(CASE WHEN a.code = '1200' THEN jl.debit - jl.credit ELSE 0 END), 0) AS bank,
              COALESCE(SUM(CASE WHEN a.code = '1300' THEN jl.debit - jl.credit ELSE 0 END), 0) AS wallet,
              COALESCE(SUM(jl.debit - jl.credit), 0) AS total
              FROM journal_lines jl JOIN accounts a ON a.id = jl.account_id JOIN journal_entries je ON je.id = jl.entry_id
              WHERE a.code IN ('1100','1200','1300') AND a.is_active = 1 AND je.status = 'posted'");
          '''
          new_php = old_php + '''
          // Authoritative admin-fee total: posted credits to account 4200 in the general ledger.
          $adminFeesTotalRow = dbFetchOne("SELECT COALESCE(SUM(jl.credit), 0) AS total
              FROM journal_lines jl
              JOIN accounts a ON a.id = jl.account_id
              JOIN journal_entries je ON je.id = jl.entry_id
              WHERE a.code = '4200' AND a.is_active = 1 AND jl.credit > 0 AND je.status = 'posted'");
          $adminFeesTotal = (float)($adminFeesTotalRow['total'] ?? 0);
          '''
          if old_php not in s:
              raise SystemExit('Treasury PHP block not found')
          s = s.replace(old_php, new_php, 1)

          old_html = '''        <div class="grid-4">
            <div class="stat-box"><div class="stat-label">💵 <?php echo e(t('fm.cash')); ?></div><div class="stat-value"><?php echo number_format((float)$treasury['cash'], 0); ?></div><div class="stat-sub"><?php echo e(t('fm.account_1100')); ?></div></div>
            <div class="stat-box blue"><div class="stat-label">🏦 <?php echo e(t('fm.bank')); ?></div><div class="stat-value"><?php echo number_format((float)$treasury['bank'], 0); ?></div><div class="stat-sub"><?php echo e(t('fm.account_1200')); ?></div></div>
            <div class="stat-box purple"><div class="stat-label">📱 <?php echo e(t('fm.wallet')); ?></div><div class="stat-value"><?php echo number_format((float)$treasury['wallet'], 0); ?></div><div class="stat-sub"><?php echo e(t('fm.account_1300')); ?></div></div>
            <div class="stat-box green"><div class="stat-label">💰 <?php echo e(t('fm.total_treasury')); ?></div><div class="stat-value"><?php echo number_format((float)$treasury['total'], 0); ?></div><div class="stat-sub"><?php echo e(t('fm.currency_sdg')); ?></div></div>
        </div>'''
          new_html = '''        <div class="grid-4" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:10px">
            <div class="stat-box" style="min-width:0;padding:14px 10px"><div class="stat-label">💵 <?php echo e(t('fm.cash')); ?></div><div class="stat-value" style="white-space:nowrap;font-size:1.55rem"><?php echo number_format((float)$treasury['cash'], 0); ?></div><div class="stat-sub"><?php echo e(t('fm.account_1100')); ?></div></div>
            <div class="stat-box blue" style="min-width:0;padding:14px 10px"><div class="stat-label">🏦 <?php echo e(t('fm.bank')); ?></div><div class="stat-value" style="white-space:nowrap;font-size:1.55rem"><?php echo number_format((float)$treasury['bank'], 0); ?></div><div class="stat-sub"><?php echo e(t('fm.account_1200')); ?></div></div>
            <div class="stat-box purple" style="min-width:0;padding:14px 10px"><div class="stat-label">📱 <?php echo e(t('fm.wallet')); ?></div><div class="stat-value" style="white-space:nowrap;font-size:1.55rem"><?php echo number_format((float)$treasury['wallet'], 0); ?></div><div class="stat-sub"><?php echo e(t('fm.account_1300')); ?></div></div>
            <div class="stat-box green" style="min-width:0;padding:14px 10px"><div class="stat-label">💰 <?php echo e(t('fm.total_treasury')); ?></div><div class="stat-value" style="white-space:nowrap;font-size:1.55rem"><?php echo number_format((float)$treasury['total'], 0); ?></div><div class="stat-sub"><?php echo e(t('fm.currency_sdg')); ?></div></div>
            <div class="stat-box purple" id="fm-treasury-admin-fee" style="min-width:0;padding:14px 10px"><div class="stat-label" style="font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">💼 الرسوم الإدارية المحصلة</div><div class="stat-value" style="white-space:nowrap;font-size:1.55rem"><?php echo number_format($adminFeesTotal, 0); ?></div><div class="stat-sub" style="font-size:.72rem;white-space:nowrap">حساب 4200 · SDG</div></div>
        </div>'''
          if old_html not in s:
              raise SystemExit('Treasury HTML block not found')
          s = s.replace(old_html, new_html, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate PHP syntax
        run: php -l modules/accounting/fm_dashboard.php

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/accounting/fm_dashboard.php
          git rm .github/workflows/one-time-fm-dashboard-treasury-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: render FM admin fee treasury card server-side"
          git push