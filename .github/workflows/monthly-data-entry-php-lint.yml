name: Monthly Data Entry PHP Lint

on:
  push:
    branches:
      - monthly-data-entry-tool
    paths:
      - 'tools/monthly-data-entry/**'
      - '.github/workflows/monthly-data-entry-php-lint.yml'
  pull_request:
    paths:
      - 'tools/monthly-data-entry/**'
      - '.github/workflows/monthly-data-entry-php-lint.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip
      - name: Lint tool PHP files
        run: find tools/monthly-data-entry -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify XLSX extension
        run: php -r 'if (!class_exists("ZipArchive")) { fwrite(STDERR, "ZipArchive is unavailable\n"); exit(1); }'
