name: Apply global search redesign v2

on:
  push:
    paths:
      - '.github/workflows/apply-search-redesign-v2.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace header search with one button
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('includes/header.php')
          s = p.read_text(encoding='utf-8')

          # Remove the entire legacy search CSS section.
          s = re.sub(r'\n\s*\.ak-search-bar-wrap \{.*?\n\s*body\.theme-dark \.ak-search-form \.btn-outline-secondary:hover \{.*?\n\s*\}\n', '\n', s, count=1, flags=re.S)

          # Remove any leftover mobile search rules.
          s = re.sub(r'\n\s*@media \(max-width: 768px\) \{\s*\.ak-search-bar-wrap \{.*?\n\s*\.ak-search-form \.btn-sm \{.*?\n\s*\}\s*', '\n        @media (max-width: 768px) {\n', s, count=1, flags=re.S)

          # Replace the actual header search markup between SEARCH comment and sticky wrapper end.
          pattern = re.compile(r'\s*<!-- =========================================================\s*SEARCH\s*========================================================= -->.*?\s*</div>\s*<!-- END header-sticky-wrapper -->', re.S)
          replacement = '''

            <!-- =========================================================
                 GLOBAL SEARCH ENTRY
                 ========================================================= -->

            <?php if ($canGlobalSearch): ?>
                <div class="d-flex justify-content-end px-3 py-2" style="background:#fff;border-bottom:1px solid #e3e7ee;">
                    <a
                        href="<?php echo APP_URL; ?>modules/search/index.php"
                        class="ak-search-entry"
                        style="background:var(--navy,#1b4d8f);"
                        aria-label="<?php echo AK_LANG === 'ar' ? 'فتح البحث العام' : 'Open global search'; ?>"
                    >
                        <i class="fas fa-search"></i>
                        <span><?php echo AK_LANG === 'ar' ? 'البحث' : 'Search'; ?></span>
                    </a>
                </div>
            <?php endif; ?>

        </div>
        <!-- END header-sticky-wrapper -->'''
          if not pattern.search(s):
              raise SystemExit('header search markup not found')
          s = pattern.sub(replacement, s, count=1)

          # Add compact button CSS immediately before </style> if absent.
          css = '''
        .ak-search-entry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 32px;
            padding: 4px 11px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            color: #fff !important;
            text-decoration: none;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .ak-search-entry:hover {
            color: #fff !important;
            transform: translateY(-1px);
            filter: brightness(1.08);
        }
        .ak-search-entry i { font-size: 0.78rem; }
'''
          if '.ak-search-entry {' not in s:
              s = s.replace('\n    </style>', css + '\n    </style>', 1)

          if any(x in s for x in ['globalSearchForm', 'ak-search-bar-wrap', 'id="searchType"', 'id="searchQuery"']):
              raise SystemExit('legacy header search controls still remain')

          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Commit and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/header.php
          git diff --cached --check
          git diff --cached --quiet || git commit -m "fix: remove legacy header search controls"
          git rm -f .github/workflows/apply-search-redesign.yml .github/workflows/apply-search-redesign-v2.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary search redesign workflows"
          fi
          git push
