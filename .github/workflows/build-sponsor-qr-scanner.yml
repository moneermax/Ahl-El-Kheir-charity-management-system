name: Build Ahl El Kheir Sponsor QR Scanner APK

on:
  push:
    branches: [main]
    paths:
      - "android/sponsor-qr-scanner/**"
      - ".github/workflows/build-sponsor-qr-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up PHP for source syntax checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint QR integration PHP files
        run: |
          php -l modules/sponsors/lib_sponsor_qr.php
          php -l modules/sponsors/view.php
          php -l modules/families/orphan_form.php
          php -l modules/families/orphan_profile.php

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK packages
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        working-directory: android/sponsor-qr-scanner
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahl-el-kheir-sponsor-qr-scanner-debug-apk
          path: android/sponsor-qr-scanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
