name: Build Ahl El Kheir Sponsor QR Scanner APK

on:
  push:
    branches: [main]
    paths:
      - "android/sponsor-qr-scanner/**"
      - ".github/workflows/build-sponsor-qr-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        working-directory: android/sponsor-qr-scanner
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahl-el-kheir-sponsor-qr-scanner-debug-apk
          path: android/sponsor-qr-scanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
