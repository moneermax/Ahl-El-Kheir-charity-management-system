name: Final search UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('includes/header.php')
          s = p.read_text(encoding='utf-8')
          marker = '                <div class="qa-user-controls">\n\n                    <a\n                        href="<?php echo e($langSwitchUrl); ?>"'
          replacement = '''                <div class="qa-user-controls">\n\n                    <?php if ($canGlobalSearch): ?>\n                    <a href="<?php echo APP_URL; ?>modules/search/index.php" class="qa-btn ak-header-search-btn" style="background: rgba(255,255,255,0.15);" aria-label="<?php echo AK_LANG === 'ar' ? 'البحث' : 'Search'; ?>" data-search-types="<?php echo e(implode(',', $allowedSearchTypes)); ?>">\n                        <i class="fas fa-search"></i>\n                        <span><?php echo AK_LANG === 'ar' ? 'بحث' : 'Search'; ?></span>\n                    </a>\n                    <?php endif; ?>\n\n                    <a\n                        href="<?php echo e($langSwitchUrl); ?>"'''
          if marker not in s: raise SystemExit('header marker missing')
          s = s.replace(marker, replacement, 1)
          s, n = re.subn(r'\n            <!-- =========================================================\n                 SEARCH\n                 ========================================================= -->\n\n            <?php if \(\$canGlobalSearch\): ?>.*?            <?php endif; ?>\n', '\n', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('header search block missing')
          s, n = re.subn(r'\n        \.ak-search-bar-wrap \{.*?\n        @media \(max-width: 991\.98px\) \{', '\n        @media (max-width: 991.98px) {', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('header search CSS missing')
          s, n = re.subn(r'\n            \.ak-search-bar-wrap \{.*?\n            \.org-header-banner \{', '\n            .org-header-banner {', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('header mobile search CSS missing')
          p.write_text(s, encoding='utf-8')

          p = Path('assets/js/app.js')
          s = p.read_text(encoding='utf-8')
          start = s.find('    /*\n     * Global search redesign')
          if start < 0: raise SystemExit('search JS block missing')
          base = s[:start].rstrip() + '\n});\n'
          js = r'''

function initSearchCenter() {
    const existingWelcome = document.querySelector('.welcome-section');
    const existingFilter = document.getElementById('filterForm');
    const content = document.querySelector('.content');
    const searchEntry = document.querySelector('.ak-header-search-btn');
    if (!content || !existingWelcome || !searchEntry || document.getElementById('akSearchCenter')) return;

    const lang = document.documentElement.lang === 'en' ? 'en' : 'ar';
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q') || '';
    const requestedType = params.get('type') || '';
    const status = params.get('status') || '';
    const month = params.get('month') || '';
    const allowed = (searchEntry.dataset.searchTypes || '').split(',').map(v => v.trim()).filter(Boolean);
    const allowAll = allowed.length === 4;
    const text = lang === 'en' ? {
        title:'Search Center', subtitle:'Search system data from one place, then narrow the results with advanced filters.', placeholder:'Search by name, code, phone number, or any detail?', scope:'Search scope', all:'All data', families:'Families & Orphans', sponsors:'Sponsors', sponsorships:'Sponsorships', payments:'Monthly Payments', advanced:'Advanced filters', hideAdvanced:'Hide advanced filters', status:'Status', allStatuses:'All statuses', month:'Month', search:'Search', reset:'Reset', activeFilters:'Active filters', remove:'Remove'
    } : {
        title:'مركز البحث', subtitle:'ابحث في بيانات النظام من مكان واحد، ثم ضيّق النتائج باستخدام الفلاتر المتقدمة.', placeholder:'ابحث بالاسم، الكود، رقم الهاتف أو أي معلومة...', scope:'نطاق البحث', all:'كل البيانات', families:'الأسر والأيتام', sponsors:'الكفلاء', sponsorships:'الكفالات', payments:'الدفعات الشهرية', advanced:'خيارات متقدمة', hideAdvanced:'إخفاء الخيارات المتقدمة', status:'الحالة', allStatuses:'كل الحالات', month:'الشهر', search:'بحث', reset:'إعادة ضبط', activeFilters:'الفلاتر النشطة', remove:'إزالة'
    };
    const labels = {all:text.all, families:text.families, sponsors:text.sponsors, sponsorships:text.sponsorships, payments:text.payments};
    const statusMap = {
        families:[['pending','قيد الانتظار'],['active','نشطة'],['paused','موقوفة'],['completed','مكتملة'],['archived','مؤرشفة'],['inactive','غير نشطة'],['closed','مغلقة']],
        sponsors:[['active','نشط'],['inactive','غير نشط'],['suspended','موقوف'],['cancelled','ملغى']],
        sponsorships:[['active','نشطة'],['paused','موقوفة'],['completed','مكتملة'],['cancelled','ملغاة']],
        payments:[['draft','مسودة'],['pending_approval','بانتظار الاعتماد'],['approved','معتمدة'],['transferred','محوّلة'],['received','مستلمة'],['returned','مغلقة مع إرجاع'],['cancelled','ملغاة'],['voided','ملغاة (فسخ)']]
    };
    if (lang === 'en') Object.keys(statusMap).forEach(k => statusMap[k] = statusMap[k].map(x => [x[0], x[0].replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())]));
    const selected = allowed.includes(requestedType) ? requestedType : (allowAll ? 'all' : (allowed[0] || ''));

    const style = document.createElement('style'); style.id='ak-search-center-style'; style.textContent=`
      .ak-search-center{margin-bottom:24px}.ak-search-hero{background:#fff;border:1px solid #e3e8ef;border-radius:16px;box-shadow:0 4px 18px rgba(10,31,68,.06);overflow:hidden}.ak-search-hero-head{padding:22px 24px 12px}.ak-search-hero-head h2{margin:0 0 4px;color:var(--navy,#1b4d8f);font-weight:800;font-size:1.35rem}.ak-search-hero-head p{margin:0;color:#64748b;font-size:.9rem}.ak-search-main{padding:8px 24px 22px}.ak-search-input-wrap{display:flex;gap:10px;align-items:center}.ak-search-input{flex:1;min-width:0;height:48px;border:2px solid #dfe6ef;border-radius:11px;padding:8px 16px;font-family:inherit;font-size:.95rem;outline:0}.ak-search-input:focus{border-color:#1f4e8c;box-shadow:0 0 0 4px rgba(31,78,140,.1)}.ak-search-submit{height:48px;padding:8px 20px;border-radius:11px;font-weight:700;white-space:nowrap}.ak-search-scope{margin-top:14px}.ak-search-label{display:block;margin-bottom:7px;font-size:.78rem;font-weight:700;color:#475569}.ak-search-scopes{display:flex;gap:7px;flex-wrap:wrap}.ak-search-scope-btn{border:1px solid #d8e1ec;background:#fff;color:#475569;border-radius:9px;padding:7px 12px;font-size:.78rem;font-weight:600;cursor:pointer}.ak-search-scope-btn.active{background:#1f4e8c;color:#fff;border-color:#1f4e8c}.ak-search-advanced-toggle{margin-top:14px;border:0;background:transparent;color:#1f4e8c;padding:0;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer}.ak-search-advanced{display:none;margin-top:14px;padding-top:15px;border-top:1px solid #e8edf3}.ak-search-advanced.open{display:block}.ak-search-filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.ak-search-field label{display:block;margin-bottom:5px;font-size:.75rem;font-weight:700;color:#475569}.ak-search-field select,.ak-search-field input{width:100%;height:38px;border:1px solid #d8e1ec;border-radius:8px;padding:5px 10px;font-family:inherit;font-size:.8rem;background:#fff}.ak-search-actions{display:flex;gap:8px;align-items:center;margin-top:13px}.ak-search-active{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}.ak-search-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#eef4fb;color:#1f4e8c;font-size:.7rem;font-weight:700}.ak-search-chip button{border:0;background:transparent;color:inherit;padding:0;cursor:pointer;font-size:.8rem}@media(max-width:767.98px){.ak-search-main,.ak-search-hero-head{padding-left:14px;padding-right:14px}.ak-search-input-wrap{flex-direction:column;align-items:stretch}.ak-search-submit{width:100%}.ak-search-filter-grid{grid-template-columns:1fr}}
    `; document.head.appendChild(style);

    const center=document.createElement('section'); center.id='akSearchCenter'; center.className='ak-search-center fade-in'; center.innerHTML=`<div class="ak-search-hero"><div class="ak-search-hero-head"><h2><i class="fas fa-search"></i> ${escapeHtml(text.title)}</h2><p>${escapeHtml(text.subtitle)}</p></div><div class="ak-search-main"><form id="akSearchForm" method="get" action=""><div class="ak-search-input-wrap"><input id="akSearchInput" class="ak-search-input" type="search" name="q" value="${escapeHtml(q)}" placeholder="${escapeHtml(text.placeholder)}" autocomplete="off"><button class="btn btn-primary ak-search-submit" type="submit"><i class="fas fa-search"></i> ${escapeHtml(text.search)}</button></div><div class="ak-search-scope"><span class="ak-search-label">${escapeHtml(text.scope)}</span><div class="ak-search-scopes" id="akSearchScopes"></div></div><button type="button" class="ak-search-advanced-toggle" id="akAdvancedToggle"><i class="fas fa-sliders"></i> <span>${escapeHtml(text.advanced)}</span></button><div class="ak-search-advanced" id="akAdvancedPanel"><div class="ak-search-filter-grid"><div class="ak-search-field" id="akStatusField"><label for="akSearchStatus">${escapeHtml(text.status)}</label><select id="akSearchStatus" name="status"><option value="">${escapeHtml(text.allStatuses)}</option></select></div><div class="ak-search-field" id="akMonthField"><label for="akSearchMonth">${escapeHtml(text.month)}</label><input id="akSearchMonth" type="month" name="month" value="${escapeHtml(month)}"></div></div><div class="ak-search-actions"><button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-filter"></i> ${escapeHtml(text.search)}</button><a href="?" class="btn btn-outline-secondary btn-sm"><i class="fas fa-rotate-left"></i> ${escapeHtml(text.reset)}</a></div></div><div class="ak-search-active" id="akActiveFilters"></div></form></div></div>`;
    content.insertBefore(center,existingWelcome); existingWelcome.style.display='none'; if(existingFilter){const bar=existingFilter.closest('.filter-bar');if(bar)bar.style.display='none';}
    const scopes=document.getElementById('akSearchScopes'); const scopeTypes=allowed.slice(); if(allowAll)scopeTypes.unshift('all');
    scopeTypes.forEach(value=>{const b=document.createElement('button');b.type='button';b.className='ak-search-scope-btn'+(selected===value?' active':'');b.dataset.type=value;b.textContent=labels[value]||value;scopes.appendChild(b);});
    function updateFilters(t){const sel=document.getElementById('akSearchStatus'),sf=document.getElementById('akStatusField'),mf=document.getElementById('akMonthField');const list=statusMap[t]||[];sel.innerHTML='<option value="">'+escapeHtml(text.allStatuses)+'</option>';list.forEach(x=>{const o=document.createElement('option');o.value=x[0];o.textContent=x[1];if(status===x[0])o.selected=true;sel.appendChild(o);});sf.style.display=list.length?'':'none';mf.style.display=t==='payments'?'':'none';}
    scopes.addEventListener('click',e=>{const b=e.target.closest('.ak-search-scope-btn');if(!b)return;const u=new URL(window.location.href);u.searchParams.set('type',b.dataset.type);u.searchParams.set('page','1');if(b.dataset.type!=='payments')u.searchParams.delete('month');window.location.href=u.toString();});
    const toggle=document.getElementById('akAdvancedToggle'),panel=document.getElementById('akAdvancedPanel'),label=toggle.querySelector('span');if(status||month){panel.classList.add('open');toggle.classList.add('open');label.textContent=text.hideAdvanced;}toggle.addEventListener('click',()=>{const open=panel.classList.toggle('open');toggle.classList.toggle('open',open);label.textContent=open?text.hideAdvanced:text.advanced;});
    updateFilters(selected);
    document.getElementById('akSearchForm').addEventListener('submit',function(){const t=document.createElement('input');t.type='hidden';t.name='type';t.value=document.querySelector('.ak-search-scope-btn.active')?.dataset.type||selected;this.appendChild(t);const pg=document.createElement('input');pg.type='hidden';pg.name='page';pg.value='1';this.appendChild(pg);});
    const active=document.getElementById('akActiveFilters'); if(q||status||month){const l=document.createElement('span');l.style.cssText='font-size:.72rem;font-weight:700;color:#64748b';l.textContent=text.activeFilters+':';active.appendChild(l);if(q)addChip(q,'q');if(status)addChip((statusMap[selected]||[]).find(x=>x[0]===status)?.[1]||status,'status');if(month)addChip(month,'month');}
    function addChip(value,key){const c=document.createElement('span');c.className='ak-search-chip';c.innerHTML=escapeHtml(value)+' <button type="button" aria-label="'+escapeHtml(text.remove)+'">×</button>';c.querySelector('button').addEventListener('click',()=>{const u=new URL(window.location.href);u.searchParams.delete(key);u.searchParams.set('page','1');window.location.href=u.toString();});active.appendChild(c);}
}
function escapeHtml(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
'''
          p.write_text(base + js, encoding='utf-8')
          # Verify the old header controls are truly gone.
          h = Path('includes/header.php').read_text(encoding='utf-8')
          if 'ak-search-bar-wrap' in h or 'globalSearchForm' in h: raise SystemExit('legacy header search remains')
          if h.count('ak-header-search-btn') != 1: raise SystemExit('search button missing')
          # Remove this temporary workflow from the final tree.
          wf=Path('.github/workflows/search-ui-fix.yml'); wf.unlink()
      - name: Validate and commit
        run: |
          php -l includes/header.php
          node --check assets/js/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/header.php assets/js/app.js .github/workflows/search-ui-fix.yml
          git commit -m "ui: remove legacy header search form"
          git push origin main
