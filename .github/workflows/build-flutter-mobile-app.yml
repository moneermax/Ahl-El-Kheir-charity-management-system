name: Build Ahl El Kheir Flutter Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/ahl_el_kheir_app/**"
      - ".github/workflows/build-flutter-mobile-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding
        run: |
          flutter create --platforms=android --project-name ahl_el_kheir_app --org org.ahlelkheir --no-pub "$RUNNER_TEMP/ahl_el_kheir_scaffold"
          cp -R "$RUNNER_TEMP/ahl_el_kheir_scaffold/android" mobile/ahl_el_kheir_app/android

      - name: Resolve Flutter dependencies
        working-directory: mobile/ahl_el_kheir_app
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: mobile/ahl_el_kheir_app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile/ahl_el_kheir_app
        run: flutter test

      - name: Build debug APK
        working-directory: mobile/ahl_el_kheir_app
        run: flutter build apk --debug

      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ahl-el-kheir-flutter-android-debug-apk
          path: mobile/ahl_el_kheir_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
