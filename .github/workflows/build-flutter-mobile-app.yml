name: Build Ahl El Kheir Flutter Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/ahl_el_kheir_app/**"
      - ".github/workflows/build-flutter-mobile-app.yml"
      - "assets/img/logo.jpg"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API v1 base URL (use HTTPS outside local development)"
        required: false
        default: "http://192.168.18.9:881/AhlElKheir/api/v1"
        type: string

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'http://192.168.18.9:881/AhlElKheir/api/v1' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding
        run: |
          flutter create --platforms=android --project-name ahl_el_kheir_app --org org.ahlelkheir --no-pub "$RUNNER_TEMP/ahl_el_kheir_scaffold"
          cp -R "$RUNNER_TEMP/ahl_el_kheir_scaffold/android" mobile/ahl_el_kheir_app/android
          # Keep the app compile SDK aligned with AndroidX plugins that require API 36.
          if [ -f mobile/ahl_el_kheir_app/android/app/build.gradle.kts ] && grep -q 'compileSdk = flutter.compileSdkVersion' mobile/ahl_el_kheir_app/android/app/build.gradle.kts; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' mobile/ahl_el_kheir_app/android/app/build.gradle.kts
          elif [ -f mobile/ahl_el_kheir_app/android/app/build.gradle ] && grep -q 'compileSdkVersion flutter.compileSdkVersion' mobile/ahl_el_kheir_app/android/app/build.gradle; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' mobile/ahl_el_kheir_app/android/app/build.gradle
          else
            echo "Unable to locate expected Flutter compileSdk declaration in generated Android app Gradle file."
            grep -R -n 'compileSdk' mobile/ahl_el_kheir_app/android/app || true
            exit 1
          fi
          mkdir -p mobile/ahl_el_kheir_app/assets
          cp assets/img/logo.jpg mobile/ahl_el_kheir_app/assets/organization_logo.jpg
          mkdir -p mobile/ahl_el_kheir_app/android/app/src/debug
          cat > mobile/ahl_el_kheir_app/android/app/src/debug/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:usesCleartextTraffic="true" />
          </manifest>
          EOF

      - name: Resolve Flutter dependencies
        working-directory: mobile/ahl_el_kheir_app
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: mobile/ahl_el_kheir_app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile/ahl_el_kheir_app
        run: flutter test

      - name: Build debug APK
        working-directory: mobile/ahl_el_kheir_app
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ahl-el-kheir-flutter-android-debug-apk
          path: mobile/ahl_el_kheir_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
