name: temporary-labor-actions-patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'moneermax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch project labor actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/projects/view.php')
          s=p.read_text(encoding='utf-8')
          marker="} elseif ($action === 'comment_labor') {"
          block=r''' } elseif ($action === 'edit_labor') {
          if ($role !== 'project_supervisor' || !akp_is_primary_supervisor($id) || $closed) throw new RuntimeException('تعديل بيانات العمالة الخارجية متاح لمشرف المشروع المكلّف فقط.');
          $laborId=(int)($_POST['labor_id']??0); $labor=dbFetchOne('SELECT * FROM project_labor_helpers WHERE id=? AND project_id=?',[$laborId,$id]); if(!$labor) throw new RuntimeException('سجل العمالة غير موجود.');
          $providerType=akp_post_value('labor_provider_type','individual'); $providerName=akp_post_value('labor_provider_name'); $workDescription=akp_post_value('labor_work_description'); $workers=max(1,(int)($_POST['labor_number_of_workers']??1)); $amount=max(0,(float)($_POST['labor_payment_amount']??0)); $paymentTiming=akp_post_value('labor_payment_timing','upon_completion'); $laborStatus=akp_post_value('labor_status','planned');
          if(!in_array($providerType,['individual','company'],true)||$providerName===''||$workDescription===''||$amount<=0) throw new RuntimeException('نوع مقدم الخدمة والاسم ووصف العمل والمبلغ مطلوبة.');
          if(!in_array($paymentTiming,['upfront','daily','weekly','monthly','upon_completion'],true)||!in_array($laborStatus,['planned','in_progress','completed'],true)) throw new RuntimeException('بيانات العمالة غير صالحة.');
          if($providerType==='company'&&akp_post_value('labor_contact_person_name')==='') throw new RuntimeException('اسم جهة الاتصال مطلوب للشركة.');
          $paymentExpense=dbFetchOne("SELECT * FROM project_expenses WHERE project_id=? AND transaction_reference=? AND status='posted' LIMIT 1",[$id,'LABOR:'.$laborId]);
          if($paymentExpense){$budgetTotal=(float)(dbFetchOne("SELECT COALESCE(SUM(COALESCE(bl.approved_amount,bl.estimated_amount)),0) total FROM project_budgets b JOIN project_budget_lines bl ON bl.budget_id=b.id WHERE b.id=? AND b.status='approved'",[(int)$paymentExpense['budget_id']])['total']??0);$otherPosted=(float)(dbFetchOne("SELECT COALESCE(SUM(amount),0) total FROM project_expenses WHERE project_id=? AND status='posted' AND id<>?",[$id,(int)$paymentExpense['id']])['total']??0);if($budgetTotal<=0||$otherPosted+$amount>$budgetTotal+0.01)throw new RuntimeException('المبلغ الجديد يتجاوز الرصيد المتاح من ميزانية المشروع.');}
          dbExecute('START TRANSACTION'); try {$currency=akp_post_value('labor_currency',$project['currency_code']?:'SDG'); dbExecute('UPDATE project_labor_helpers SET provider_type=?,provider_name=?,phone=?,contact_person_name=?,contact_person_phone=?,number_of_workers=?,work_description=?,payment_amount=?,currency_code=?,payment_timing=?,status=?,notes=?,updated_by=? WHERE id=? AND project_id=?',[$providerType,$providerName,akp_post_value('labor_phone')?:null,akp_post_value('labor_contact_person_name')?:null,akp_post_value('labor_contact_person_phone')?:null,$workers,$workDescription,$amount,$currency,$paymentTiming,$laborStatus,akp_post_value('labor_notes')?:null,akp_user_id(),$laborId,$id]); if($paymentExpense){dbExecute('UPDATE project_expenses SET description=?,vendor_name=?,vendor_contact=?,amount=?,currency_code=? WHERE id=? AND project_id=? AND transaction_reference=? AND status=\'posted\'',['دفعة عمالة من ميزانية المشروع: '.$providerName.' — '.$workDescription,$providerName,akp_post_value('labor_phone')?:null,$amount,$currency,(int)$paymentExpense['id'],$id,'LABOR:'.$laborId]);if(!empty($paymentExpense['primary_document_id']))dbExecute("UPDATE project_documents SET title=?,issuer=?,amount=?,currency_code=? WHERE id=? AND project_id=? AND document_type='receipt'",['إيصال دفعة عمالة: '.$providerName,$providerName,$amount,$currency,(int)$paymentExpense['primary_document_id'],$id]);} dbExecute('COMMIT');}catch(Throwable $e){dbExecute('ROLLBACK');throw $e;}
          akp_audit('UPDATE','project_labor_helper',$laborId,['project_id'=>$id,'amount'=>(float)$labor['payment_amount']],['project_id'=>$id,'amount'=>$amount,'paid'=>!empty($paymentExpense)]); $_SESSION['project_toast_success']='تم تعديل بيانات العمالة وتحديث المصروف المرتبط بها.';
          } elseif ($action === 'delete_labor') {
          if($role!=='project_supervisor'||!akp_is_primary_supervisor($id)||$closed)throw new RuntimeException('حذف بيانات العمالة الخارجية متاح لمشرف المشروع المكلّف فقط.'); $laborId=(int)($_POST['labor_id']??0); $labor=dbFetchOne('SELECT * FROM project_labor_helpers WHERE id=? AND project_id=?',[$laborId,$id]); if(!$labor)throw new RuntimeException('سجل العمالة غير موجود.'); $paymentExpense=dbFetchOne("SELECT * FROM project_expenses WHERE project_id=? AND transaction_reference=? AND status='posted' LIMIT 1",[$id,'LABOR:'.$laborId]); $receiptPath=null; if($paymentExpense&&!empty($paymentExpense['primary_document_id'])){$receipt=dbFetchOne("SELECT file_path FROM project_documents WHERE id=? AND project_id=? AND document_type='receipt'",[(int)$paymentExpense['primary_document_id'],$id]);$receiptPath=$receipt['file_path']??null;}
          dbExecute('START TRANSACTION');try{dbExecute('DELETE FROM project_labor_comments WHERE labor_id=?',[$laborId]);if($paymentExpense&&!empty($paymentExpense['primary_document_id']))dbExecute("DELETE FROM project_documents WHERE id=? AND project_id=? AND document_type='receipt'",[(int)$paymentExpense['primary_document_id'],$id]);if($paymentExpense)dbExecute("DELETE FROM project_expenses WHERE id=? AND project_id=? AND transaction_reference=? AND status='posted'",[(int)$paymentExpense['id'],$id,'LABOR:'.$laborId]);dbExecute('DELETE FROM project_labor_helpers WHERE id=? AND project_id=?',[$laborId,$id]);dbExecute('COMMIT');}catch(Throwable $e){dbExecute('ROLLBACK');throw $e;} if($receiptPath){$path=dirname(__DIR__,2).'/'.$receiptPath;if(is_file($path))@unlink($path);} akp_audit('DELETE','project_labor_helper',$laborId,['project_id'=>$id,'amount'=>(float)$labor['payment_amount'],'paid'=>!empty($paymentExpense)],null);$_SESSION['project_toast_success']='تم حذف سجل العمالة والمصروف المرتبط به وإعادة المبلغ إلى الرصيد المتاح للمشروع.';
          } elseif ($action === 'comment_labor') {'''
          if marker not in s: raise SystemExit('comment marker missing')
          s=s.replace(marker,block,1)
          old='''<td class="text-nowrap"><?php if(!$closed&&$role==='project_supervisor'&&akp_is_primary_supervisor($id)&&empty($labor['payment_expense_id'])): ?><button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#recordLaborPaymentModal" data-labor-id="<?php echo (int)$labor['id']; ?>" data-labor-name="<?php echo e($labor['provider_name']); ?>" data-labor-work="<?php echo e($labor['work_description']); ?>" data-labor-amount="<?php echo e($labor['payment_amount']); ?>" data-labor-currency="<?php echo e($labor['currency_code']); ?>"><i class="fas fa-money-bill-wave me-1"></i>تسجيل الدفع</button><?php endif; ?><?php if(akp_is_executive()&&!$closed): ?>'''
          new='''<td class="text-nowrap"><?php if(!$closed&&$role==='project_supervisor'&&akp_is_primary_supervisor($id)): ?><button type="button" class="btn btn-sm btn-outline-primary mb-1" data-bs-toggle="modal" data-bs-target="#editLaborModal" data-labor='<?php echo e(json_encode($labor, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)); ?>'><i class="fas fa-pen me-1"></i>تعديل</button><form method="post" class="d-inline project-delete-form"><?php echo csrf_field(); ?><input type="hidden" name="action" value="delete_labor"><input type="hidden" name="labor_id" value="<?php echo (int)$labor['id']; ?>"><button type="button" class="btn btn-sm btn-outline-danger project-delete-btn mb-1" data-confirm-title="حذف العمالة" data-confirm-text="سيتم حذف سجل العمالة والمصروف وسند الدفع والإيصال المرتبط به إن وُجد، وإعادة المبلغ إلى الرصيد المتاح للمشروع."><i class="fas fa-trash me-1"></i>حذف</button><?php if(empty($labor['payment_expense_id'])): ?><button type="button" class="btn btn-sm btn-primary mb-1" data-bs-toggle="modal" data-bs-target="#recordLaborPaymentModal" data-labor-id="<?php echo (int)$labor['id']; ?>" data-labor-name="<?php echo e($labor['provider_name']); ?>" data-labor-work="<?php echo e($labor['work_description']); ?>" data-labor-amount="<?php echo e($labor['payment_amount']); ?>" data-labor-currency="<?php echo e($labor['currency_code']); ?>"><i class="fas fa-money-bill-wave me-1"></i>تسجيل الدفع</button><?php endif; ?><?php endif; ?><?php if(akp_is_executive()&&!$closed): ?>'''
          if old not in s: raise SystemExit('labor action cell missing')
          s=s.replace(old,new,1)
          marker2='<div class="modal fade" id="recordLaborPaymentModal"'
          modal='''<div class="modal fade" id="editLaborModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title"><i class="fas fa-pen me-2"></i>تعديل العمالة الخارجية</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button></div><form method="post"><div class="modal-body"><?php echo csrf_field(); ?><input type="hidden" name="action" value="edit_labor"><input type="hidden" name="labor_id" id="edit-labor-id"><div class="row g-3"><div class="col-md-3"><label class="form-label small fw-semibold">نوع مقدم الخدمة</label><select name="labor_provider_type" id="edit-labor-provider-type" class="form-select form-select-sm"><option value="individual">فرد</option><option value="company">شركة</option></select></div><div class="col-md-5"><label class="form-label small fw-semibold">اسم العامل/الشركة *</label><input name="labor_provider_name" id="edit-labor-provider-name" class="form-control form-control-sm" required></div><div class="col-md-4"><label class="form-label small fw-semibold">الهاتف</label><input name="labor_phone" id="edit-labor-phone" class="form-control form-control-sm"></div><div class="col-md-4"><label class="form-label small fw-semibold">جهة الاتصال</label><input name="labor_contact_person_name" id="edit-labor-contact" class="form-control form-control-sm"></div><div class="col-md-4"><label class="form-label small fw-semibold">هاتف جهة الاتصال</label><input name="labor_contact_person_phone" id="edit-labor-contact-phone" class="form-control form-control-sm"></div><div class="col-md-4"><label class="form-label small fw-semibold">عدد العمال</label><input name="labor_number_of_workers" id="edit-labor-workers" type="number" min="1" class="form-control form-control-sm"></div><div class="col-md-8"><label class="form-label small fw-semibold">وصف العمل/المساعدة *</label><input name="labor_work_description" id="edit-labor-work" class="form-control form-control-sm" required></div><div class="col-md-4"><label class="form-label small fw-semibold">إجمالي المبلغ *</label><input name="labor_payment_amount" id="edit-labor-amount" type="number" step="0.01" min="0.01" class="form-control form-control-sm" required></div><div class="col-md-4"><label class="form-label small fw-semibold">توقيت الدفع</label><select name="labor_payment_timing" id="edit-labor-timing" class="form-select form-select-sm"><option value="upfront">مقدم</option><option value="daily">يومي</option><option value="weekly">أسبوعي</option><option value="monthly">شهري</option><option value="upon_completion">عند الإنجاز</option></select></div><div class="col-md-4"><label class="form-label small fw-semibold">حالة التنفيذ</label><select name="labor_status" id="edit-labor-status" class="form-select form-select-sm"><option value="planned">مخطط</option><option value="in_progress">قيد التنفيذ</option><option value="completed">مكتمل</option></select></div><div class="col-12"><label class="form-label small fw-semibold">ملاحظات المشرف</label><textarea name="labor_notes" id="edit-labor-notes" class="form-control form-control-sm" rows="2"></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button><button class="btn btn-primary"><i class="fas fa-save me-1"></i>حفظ التعديل</button></div></form></div></div></div><div class="modal fade" id="recordLaborPaymentModal"'''
          if marker2 not in s: raise SystemExit('payment modal marker missing')
          s=s.replace(marker2,modal,1)
          script_marker="document.addEventListener('DOMContentLoaded',function(){var modal=document.getElementById('recordLaborPaymentModal');"
          script_new="document.addEventListener('DOMContentLoaded',function(){var edit=document.getElementById('editLaborModal');if(edit)edit.addEventListener('show.bs.modal',function(event){var b=event.relatedTarget;if(!b)return;var d=JSON.parse(b.getAttribute('data-labor')||'{}');var map={'id':'edit-labor-id','provider_type':'edit-labor-provider-type','provider_name':'edit-labor-provider-name','phone':'edit-labor-phone','contact_person_name':'edit-labor-contact','contact_person_phone':'edit-labor-contact-phone','number_of_workers':'edit-labor-workers','work_description':'edit-labor-work','payment_amount':'edit-labor-amount','payment_timing':'edit-labor-timing','status':'edit-labor-status','notes':'edit-labor-notes'};Object.keys(map).forEach(function(k){var el=document.getElementById(map[k]);if(el)el.value=d[k]??'';});});var modal=document.getElementById('recordLaborPaymentModal');"
          if script_marker not in s: raise SystemExit('payment script marker missing')
          s=s.replace(script_marker,script_new,1)
          old_exp='''<?php if ($expense['status'] === 'draft' && $role === 'project_supervisor' && akp_is_primary_supervisor($id) && !$closed): ?>'''
          new_exp='''<?php if (!empty($expense['labor_id']) && $role === 'project_supervisor' && akp_is_primary_supervisor($id) && !$closed): ?><button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#editLaborModal" data-labor='<?php $linkedLabor=$labors[array_search((int)$expense['labor_id'], array_map('intval', array_column($labors,'id')))] ?? null; echo e(json_encode($linkedLabor ?: ['id'=>(int)$expense['labor_id'],'payment_amount'=>$expense['amount'],'provider_name'=>$expense['vendor_name'],'work_description'=>$expense['description']], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)); ?>'><i class="fas fa-pen me-1"></i>تعديل</button><form method="post" class="d-inline project-delete-form"><?php echo csrf_field(); ?><input type="hidden" name="action" value="delete_labor"><input type="hidden" name="labor_id" value="<?php echo (int)$expense['labor_id']; ?>"><button type="button" class="btn btn-sm btn-outline-danger project-delete-btn" data-confirm-title="حذف دفعة العمالة" data-confirm-text="سيتم حذف سجل العمالة والمصروف وسند الدفع والإيصال المرتبط به إن وُجد.">حذف</button></form>
          <?php elseif ($expense['status'] === 'draft' && $role === 'project_supervisor' && akp_is_primary_supervisor($id) && !$closed): ?>'''
          if old_exp not in s: raise SystemExit('expense action marker missing')
          s=s.replace(old_exp,new_exp,1)
          p.write_text(s,encoding='utf-8')
          PY
          php -l modules/projects/view.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/projects/view.php
          git commit -m 'Add edit and delete actions for project labor'
          git push
          rm -f .github/workflows/temporary-labor-actions-patch.yml
          git add .github/workflows/temporary-labor-actions-patch.yml
          git commit -m 'Remove temporary labor actions patch workflow'
          git push
