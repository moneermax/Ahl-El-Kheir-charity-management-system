name: Mobile API auth integration

on:
  push:
    branches: [main]
    paths:
      - 'api/v1/**'
      - 'mobile_web_handoff.php'
      - 'config/config.php'
      - 'config/database.php'
      - 'config/environment.php'
      - 'database/ahl_el_kheir.sql'
      - 'database/migrations/2026-10-24_mobile_api_sessions.sql'
      - 'database/migrations/2026-10-25_mobile_web_handoffs.sql'
      - 'database/migrations/2026-09-17_fina_standalone_schema.sql'
      - 'database/migrations/2026-10-05_hr_attendance_policy.sql'
      - 'database/migrations/2026-10-26_hr_attendance_policy_working_days.sql'
      - 'database/migrations/2026-10-20_hr_fm_payroll_transfer_workflow.sql'
      - 'database/migrations/2026-10-23_document_archive_catalogue.sql'
      - 'tools/test_mobile_api_auth_integration.php'
      - 'tools/test_mobile_admin_users_action_service.php'
      - 'modules/hr/lib_employee_provisioning.php'
      - 'modules/hr/lib_payroll_management.php'
      - 'modules/hr/lib_payroll_accounting.php'
      - 'modules/hr/lib_payroll_transfer.php'
      - 'modules/hr/lib_salary_advance_payroll.php'
      - 'modules/hr/lib_gm_payroll_period.php'
      - 'modules/hr/lib_payroll_policy.php'
      - 'modules/projects/project_lib.php'
      - 'modules/hr/lib_employee_incentives.php'
      - '.github/workflows/mobile-api-auth-integration.yml'
  pull_request:
    paths:
      - 'api/v1/**'
      - 'mobile_web_handoff.php'
      - 'config/config.php'
      - 'config/database.php'
      - 'config/environment.php'
      - 'database/ahl_el_kheir.sql'
      - 'database/migrations/2026-10-24_mobile_api_sessions.sql'
      - 'database/migrations/2026-10-25_mobile_web_handoffs.sql'
      - 'database/migrations/2026-10-20_hr_fm_payroll_transfer_workflow.sql'
      - 'tools/test_mobile_api_auth_integration.php'
      - '.github/workflows/mobile-api-auth-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-api-auth:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mobile_api_auth_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MOBILE_API_AUTH_TEST: '1'
      AHL_ENV: development
      AHL_DB_HOST: 127.0.0.1
      AHL_DB_PORT: '3306'
      AHL_DB_NAME: mobile_api_auth_test
      AHL_DB_USER: root
      AHL_DB_PASS: root
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Import the checked-in schema and apply the mobile session migration
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/ahl_el_kheir.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/migrations/2026-10-12_hr_employee_incentive_catalogue_and_policy_fields.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/migrations/2026-10-13_hr_incentive_policy_gm_approval.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/migrations/2026-10-15_hr_incentive_policy_approval_withdrawal.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/migrations/2026-09-17_fina_standalone_schema.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/migrations/2026-10-05_hr_attendance_policy.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/migrations/2026-10-26_hr_attendance_policy_working_days.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/migrations/2026-10-20_hr_fm_payroll_transfer_workflow.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/migrations/2026-10-24_mobile_api_sessions.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/migrations/2026-10-24_mobile_api_sessions.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/migrations/2026-10-25_mobile_web_handoffs.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=mobile_api_auth_test < database/migrations/2026-10-23_document_archive_catalogue.sql

      - name: PHP syntax check for payroll API and shared helpers
        run: |
          php -l api/v1/admin/disbursements.php
          php -l api/v1/accounting/journal.php
          php -l api/v1/accounting/vouchers.php
          php -l api/v1/accounting/gm_reconciliation.php
          php -l api/v1/administration/winback.php
          php -l api/v1/search/sponsors.php
          php -l api/v1/search/documents.php
          php -l api/v1/search/document_file.php
          php -l modules/projects/project_lib.php
          php -l api/v1/hr/incentive_verification.php
          php -l modules/hr/lib_employee_incentives.php
          php -l api/v1/hr/payroll_policy.php
          php -l api/v1/hr/payroll_management.php
          php -l api/v1/hr/payroll_proof.php
          php -l api/v1/auth/change_password.php
          php -l api/v1/auth/complete_forced_password_change.php
          php -l api/v1/auth/password_recovery_request.php
          php -l api/v1/auth/login.php
          php -l modules/hr/lib_payroll_management.php
          php -l modules/hr/lib_payroll_accounting.php
          php -l modules/hr/payroll.php
          php -l tools/test_mobile_api_auth_integration.php

      - name: Verify native user actions and rollback against disposable MariaDB
        run: php tools/test_mobile_admin_users_action_service.php

      - name: Exercise live PHP API endpoints against disposable MariaDB
        run: php tools/test_mobile_api_auth_integration.php
