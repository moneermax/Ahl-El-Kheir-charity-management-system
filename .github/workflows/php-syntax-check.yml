name: Salary advance verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Lint selected PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            api/v1/projects/index.php
            api/v1/projects/detail.php
            api/v1/hr/attendance.php
            api/v1/hr/leaves.php
            api/v1/hr/leaves/action.php
            api/v1/sponsors/index.php
            api/v1/families/index.php
            modules/hr/contract_builder.php
            modules/hr/job_description_catalogue.php
            modules/hr/lib_salary_advance_repayment.php
            modules/hr/lib_salary_advance_request.php
            modules/hr/lib_salary_advance_policy.php
            modules/hr/salary_advance_policy.php
            modules/hr/salary_advance_dashboard.php
            modules/hr/salary_advance_reschedule.php
            modules/hr/lib_salary_advance_payroll.php
            modules/hr/salary_advance_processing.php
            modules/hr/salary_advance_request.php
            modules/accounting/lib_transaction_review.php
            modules/families/orphan_form.php
            modules/accounting/group_verification.php
            modules/accounting/nanny_pre_verification.php
            lang/bridge/ar_to_en.php
            modules/accounting/lib_admin_fee_policy.php
            modules/accounting/lib.php
            modules/accounting/fm_review_queue.php
            modules/accounting/lib_sponsor_payment_approval.php
            modules/ai_assistant/chat.php
            includes/ai_assistant_widget.php
            tools/run_hr_fm_sponsor_payment_approval_integration_tests.php
            tools/run_hr_project_incentive_payroll_rollback_tests.php
            tools/test_salary_advance_rescheduling_migration.php
            tools/test_salary_advance_rescheduling_service.php
            tools/test_salary_advance_rescheduling_lock_order.php
            tools/test_salary_advance_rescheduling_full_schema.php
            tools/inspect_salary_advance_rescheduling_prerequisites.php
            tools/test_salary_advance_rescheduling_payroll_concurrency.php
            tools/run_salary_advance_stage5_schedule_tests.php
            tools/run_salary_advance_stage5_payroll_tests.php
            tools/run_salary_advance_stage5_payroll_edge_tests.php
            tools/run_salary_advance_1410_reconciliation.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done

  migration-mariadb-10-4:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: salary_advance_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Verify migration on disposable MariaDB 10.4.32
        env:
          SALARY_ADVANCE_MIGRATION_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: salary_advance_migration_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php tools/test_salary_advance_rescheduling_migration.php

  rescheduling-service-tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: salary_advance_reschedule_service_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 with PDO MySQL and mbstring
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Verify rescheduling safeguards on disposable MariaDB
        env:
          SALARY_ADVANCE_RESCHEDULE_SERVICE_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: salary_advance_reschedule_service_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          set -euo pipefail
          php tools/test_salary_advance_rescheduling_service.php
          php tools/test_salary_advance_rescheduling_lock_order.php

  migration-full-schema:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: salary_advance_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Import checked-in database schema and legacy data
        env:
          MYSQL_PWD: root
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/ahl_el_kheir.sql

      - name: Apply migration and verify full schema backfill
        env:
          SALARY_ADVANCE_MIGRATION_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: salary_advance_migration_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php tools/test_salary_advance_rescheduling_full_schema.php

      - name: Run rollback-only Stage 5 payroll regressions and account 1410 reconciliation
        env:
          AHL_ENV: development
          AHL_DB_HOST: 127.0.0.1
          AHL_DB_PORT: '3306'
          AHL_DB_NAME: salary_advance_migration_test
          AHL_DB_USER: root
          AHL_DB_PASS: root
        run: |
          set -euo pipefail
          php tools/run_salary_advance_stage5_schedule_tests.php
          php tools/run_salary_advance_stage5_payroll_tests.php
          php tools/run_salary_advance_stage5_payroll_edge_tests.php
          php tools/run_salary_advance_1410_reconciliation.php
          php tools/test_salary_advance_rescheduling_payroll_concurrency.php

  hr-job-description-migrations:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hr_job_description_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Import checked-in schema
        env:
          MYSQL_PWD: root
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --database=hr_job_description_migration_test < database/ahl_el_kheir.sql

      - name: Apply HR catalogue migration sequence and verify approved-record preservation
        env:
          MYSQL_PWD: root
        shell: bash
        run: |
          set -euo pipefail
          mysql=(mysql --host=127.0.0.1 --port=3306 --user=root --database=hr_job_description_migration_test)
          "${mysql[@]}" < database/migrations/2026-10-20_hr_job_description_catalogue.sql

          # Build a CI-only approved-record fixture with intentionally blank fields.
          # Proposal/backfill migrations must leave its status and content unchanged.
          "${mysql[@]}" <<'SQL'
          SET NAMES utf8mb4;
          INSERT INTO hr_job_description_templates
              (position_title, description_status, is_active, created_at, updated_at)
          SELECT 'مدير الموارد البشرية', 'approved', 1, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          WHERE NOT EXISTS (
              SELECT 1 FROM hr_job_description_templates
              WHERE position_title = 'مدير الموارد البشرية'
          );
          UPDATE hr_job_description_templates
          SET description_status = 'approved',
              role_purpose = NULL,
              responsibilities = NULL,
              qualifications = NULL,
              reporting_to = NULL,
              is_active = 1
          WHERE position_title = 'مدير الموارد البشرية';
          SQL

          for migration in \
            database/migrations/2026-10-20_hr_job_description_proposals.sql \
            database/migrations/2026-10-20_hr_job_description_system_roles.sql \
            database/migrations/2026-10-20_hr_job_description_z_clear_unreviewed_generic_drafts.sql \
            database/migrations/2026-10-20_hr_job_description_zz_role_qualifications.sql \
            database/migrations/2026-10-20_hr_job_description_zz_role_qualifications_utf8_repair.sql \
            database/migrations/2026-10-20_hr_job_description_zzz_general_fallback_drafts.sql \
            database/migrations/2026-10-20_hr_job_description_zzzz_qualification_baseline.sql
          do
            "${mysql[@]}" < "$migration"
          done

          approved_guard=$("${mysql[@]}" --batch --skip-column-names -e "
            SELECT IF(
              COUNT(*) = 1
              AND SUM(description_status = 'approved'
                      AND role_purpose IS NULL
                      AND responsibilities IS NULL
                      AND qualifications IS NULL
                      AND reporting_to IS NULL
                      AND is_active = 1) = 1,
              1, 0)
            FROM hr_job_description_templates
            WHERE position_title = 'مدير الموارد البشرية'
              AND system_role_code = '';
          ")
          test "$approved_guard" = "1"

