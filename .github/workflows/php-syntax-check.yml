  migration-mariadb-10-4:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: salary_advance_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Verify migration on disposable MariaDB 10.4.32
        env:
          SALARY_ADVANCE_MIGRATION_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: salary_advance_migration_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php tools/test_salary_advance_rescheduling_migration.php

  rescheduling-service-tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: salary_advance_reschedule_service_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 with PDO MySQL and mbstring
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Verify rescheduling safeguards on disposable MariaDB
        env:
          SALARY_ADVANCE_RESCHEDULE_SERVICE_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: salary_advance_reschedule_service_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          set -euo pipefail
          php tools/test_salary_advance_rescheduling_service.php
          php tools/test_salary_advance_rescheduling_lock_order.php


  sponsor-request-migration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sponsor_request_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Verify clean install and repeatability
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          mysql=(mysql --host=127.0.0.1 --port=3306 --user=root --database=sponsor_request_migration_test)
          "${mysql[@]}" < database/migrations/2026-10-29_sponsor_requests_canonical_workflow.sql
          "${mysql[@]}" < database/migrations/2026-10-29_sponsor_requests_canonical_workflow.sql
          columns=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'sponsor_requests' AND column_name IN ('sponsor_name','sponsor_type','preferred_payment_method','assigned_supervisor_id','status','gender','desired_orphans','source')")
          test "$columns" = "8"
          status_enum=$("${mysql[@]}" --batch --skip-column-names -e "SELECT column_type FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'sponsor_requests' AND column_name = 'status'")
          [[ "$status_enum" == *"'new'"* && "$status_enum" == *"'contacted'"* && "$status_enum" == *"'converted'"* && "$status_enum" == *"'lost'"* ]]
          routines=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema = DATABASE() AND routine_name LIKE 'ak_reconcile_sponsor_request%'")
          test "$routines" = "0"

      - name: Verify legacy full_name and statuses are preserved and normalized
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          mysql --host=127.0.0.1 --port=3306 --user=root -e "CREATE DATABASE sponsor_request_legacy_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          mysql=(mysql --host=127.0.0.1 --port=3306 --user=root --database=sponsor_request_legacy_test)
          "${mysql[@]}" -e "CREATE TABLE sponsor_requests (id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY, full_name VARCHAR(255) NOT NULL, phone VARCHAR(30) DEFAULT NULL, status ENUM('pending','confirmed','rejected') NOT NULL DEFAULT 'pending', created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci"
          "${mysql[@]}" -e "INSERT INTO sponsor_requests (full_name, phone, status) VALUES ('Legacy Pending','0912345678','pending'),('Legacy Confirmed','0912345679','confirmed'),('Legacy Rejected','0912345680','rejected')"
          "${mysql[@]}" < database/migrations/2026-10-29_sponsor_requests_canonical_workflow.sql
          "${mysql[@]}" < database/migrations/2026-10-29_sponsor_requests_canonical_workflow.sql
          rows=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM sponsor_requests")
          test "$rows" = "3"
          preserved=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM sponsor_requests WHERE (sponsor_name = 'Legacy Pending' AND status = 'new') OR (sponsor_name = 'Legacy Confirmed' AND status = 'converted') OR (sponsor_name = 'Legacy Rejected' AND status = 'lost')")
          test "$preserved" = "3"
          old_column=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'sponsor_requests' AND column_name = 'full_name'")
          test "$old_column" = "0"
          routines=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema = DATABASE()")
          test "$routines" = "0"

  migration-full-schema:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: salary_advance_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Import checked-in database schema and legacy data
        env:
          MYSQL_PWD: root
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/ahl_el_kheir.sql
          # Move User Management schema/reference-data setup out of page requests; verify repeatability on the full checked-in schema.
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_user_management_runtime_schema_cleanup.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_user_management_runtime_schema_cleanup.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_accounting_core_runtime_schema_cleanup.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_accounting_core_runtime_schema_cleanup.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_other_php_runtime_schema_cleanup.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_other_php_runtime_schema_cleanup.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_accounting_outflows_schema_cleanup.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_accounting_outflows_schema_cleanup.sql
          user_management_columns=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND ((table_name = 'users' AND column_name IN ('department_id','manager_id')) OR (table_name = 'sponsors' AND column_name = 'gender') OR (table_name = 'families' AND column_name = 'nanny_id') OR (table_name = 'supervisor_letters' AND column_name = 'gender') OR (table_name = 'family_documents' AND column_name IN ('file_name','file_size','notes','doc_type')))")
          user_management_departments=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM departments WHERE name_en IN ('General Management','Mothers Affairs','Lost & Found','Social Media','Sponsor Affairs','Accounting & Finance')")
          user_management_roles=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM roles WHERE code IN ('financial_manager','accountant_staff','nanny','administration','social_media')")
          test "$user_management_columns" = "9"
          test "$user_management_departments" = "6"
          test "$user_management_roles" = "5"
          accounting_core_tables=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('accounts','journal_entries','journal_lines','vouchers','project_beneficiaries','accounting_admin_fee_policies')")
          accounting_core_columns=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND ((table_name = 'other_projects' AND column_name IN ('revenue_account_id','expense_account_id')) OR (table_name = 'transactions' AND column_name IN ('admin_fee_method','admin_fee_value','admin_fee_policy_id')) OR (table_name = 'sponsor_payments' AND column_name = 'payment_method'))")
          test "$accounting_core_tables" = "6"
          test "$accounting_core_columns" = "6"
          other_php_schema_columns=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND ((table_name = 'users' AND column_name IN ('avatar_path','address','birth_date','gender')) OR (table_name = 'sponsors' AND column_name = 'is_manual_override') OR (table_name = 'transactions' AND column_name IN ('receipt_path','unified_receipt_path')))")
          other_php_schema_tables=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('sponsor_import_exceptions','hr_payroll_reversals')")
          test "$other_php_schema_columns" = "7"
          test "$other_php_schema_tables" = "2"
          outflow_schema_columns=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND ((table_name = 'monthly_disbursements' AND column_name IN ('group_id','returned_amount','return_receipt_file_path','returned_by_user_id','returned_at','return_receipt_by_user_id','return_receipt_at')) OR (table_name = 'disbursement_items' AND column_name = 'updated_at'))")
          outflow_schema_tables=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('monthly_disbursements','disbursement_items','nanny_family_verifications')")
          outflow_schema_enum=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT column_type FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'monthly_disbursements' AND column_name = 'status'")
          test "$outflow_schema_columns" = "8"
          test "$outflow_schema_tables" = "3"
          [[ "$outflow_schema_enum" == *"'pending_approval'"* ]]
          [[ "$outflow_schema_enum" != *"'pending',"* ]]
