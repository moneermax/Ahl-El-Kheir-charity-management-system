name: Salary advance PHP syntax check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint salary-advance PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/hr/lib_salary_advance_repayment.php
            modules/hr/lib_salary_advance_policy.php
            modules/hr/salary_advance_policy.php
            modules/hr/salary_advance_reschedule.php
            modules/hr/lib_salary_advance_payroll.php
            modules/hr/salary_advance_processing.php
            modules/hr/salary_advance_request.php
            modules/accounting/lib_transaction_review.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done
