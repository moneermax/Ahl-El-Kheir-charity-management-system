name: PHP syntax check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -o pipefail
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -print0 | xargs -0 -r -n 1 php -l
