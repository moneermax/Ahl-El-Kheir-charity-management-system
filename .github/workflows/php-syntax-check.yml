            api/v1/fina/dashboard.php
            api/v1/fina/receipt.php
            api/v1/fina/report.php
            api/v1/fina/review.php
            api/v1/fina/sponsors.php
            api/v1/hr/incentive_policy.php
            api/v1/hr/incentive_verification.php
            api/v1/hr/payroll_management.php
            api/v1/hr/payroll_policy.php
            api/v1/hr/payroll_proof.php
            api/v1/hr/salary_advance_dashboard.php
            api/v1/nanny/returned_funds.php
            api/v1/search/document_file.php
            api/v1/search/documents.php
            api/v1/search/sponsors.php
            api/v1/transactions/query_service.php
            modules/users/index.php
            modules/families/create.php
            modules/families/edit.php
            modules/families/documents.php
            modules/hr/contract_builder.php
            modules/hr/job_description_catalogue.php
            modules/hr/salary_portal.php
            modules/projects/form.php
            modules/projects/view.php
            modules/hr/lib_salary_advance_repayment.php
            modules/hr/lib_salary_advance_request.php
            modules/hr/lib_salary_advance_policy.php
            modules/hr/salary_advance_policy.php
            modules/hr/salary_advance_dashboard.php
            modules/hr/salary_advance_reschedule.php
            modules/hr/lib_salary_advance_payroll.php
            modules/hr/lib_salary_advance_waiver.php
            modules/hr/salary_advance_waiver_fm.php
            modules/hr/salary_advance_waiver_gm.php
            modules/hr/salary_advance_processing.php
            modules/hr/salary_advance_request.php
            modules/accounting/lib_transaction_review.php
            modules/families/orphan_form.php
            modules/families/suspensions.php
            modules/accounting/group_verification.php
            modules/accounting/nanny_pre_verification.php
            lang/bridge/ar_to_en.php
            modules/accounting/lib_admin_fee_policy.php
            modules/accounting/lib.php
            modules/accounting/fm_review_queue.php
            modules/accounting/lib_sponsor_payment_approval.php
            modules/ai_assistant/chat.php
            includes/ai_assistant_widget.php
            tools/run_hr_fm_sponsor_payment_approval_integration_tests.php
            tools/run_hr_project_incentive_payroll_rollback_tests.php
            tools/test_salary_advance_rescheduling_migration.php
            tools/test_salary_advance_rescheduling_service.php
            tools/test_salary_advance_rescheduling_lock_order.php
            tools/test_salary_advance_rescheduling_full_schema.php
            tools/inspect_salary_advance_rescheduling_prerequisites.php
            tools/test_salary_advance_rescheduling_payroll_concurrency.php
            tools/run_salary_advance_stage5_schedule_tests.php
            tools/run_salary_advance_stage5_payroll_tests.php
            tools/run_salary_advance_stage5_payroll_edge_tests.php
            tools/run_salary_advance_1410_reconciliation.php
            tools/test_mobile_api_role_normalization.php
            tools/test_mobile_api_suspension_service.php
            tools/test_mobile_transactions_date_filter.php
            tools/test_mobile_role_dashboard_queries.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done
          if grep -nE 'CREATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE' modules/accounting/lib.php modules/accounting/lib_admin_fee_policy.php; then
            echo "Runtime schema DDL found in accounting core libraries" >&2
            exit 1
          fi
          php tools/test_mobile_api_role_normalization.php

  migration-mariadb-10-4:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: salary_advance_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Verify migration on disposable MariaDB 10.4.32
        env:
          SALARY_ADVANCE_MIGRATION_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: salary_advance_migration_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php tools/test_salary_advance_rescheduling_migration.php

  rescheduling-service-tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: salary_advance_reschedule_service_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 with PDO MySQL and mbstring
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Verify rescheduling safeguards on disposable MariaDB
        env:
          SALARY_ADVANCE_RESCHEDULE_SERVICE_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: salary_advance_reschedule_service_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          set -euo pipefail
          php tools/test_salary_advance_rescheduling_service.php
          php tools/test_salary_advance_rescheduling_lock_order.php

  migration-full-schema:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: salary_advance_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Import checked-in database schema and legacy data
        env:
          MYSQL_PWD: root
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/ahl_el_kheir.sql
          # Move User Management schema/reference-data setup out of page requests; verify repeatability on the full checked-in schema.
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_user_management_runtime_schema_cleanup.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_user_management_runtime_schema_cleanup.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_accounting_core_runtime_schema_cleanup.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-28_accounting_core_runtime_schema_cleanup.sql
          user_management_columns=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND ((table_name = 'users' AND column_name IN ('department_id','manager_id')) OR (table_name = 'sponsors' AND column_name = 'gender') OR (table_name = 'families' AND column_name = 'nanny_id') OR (table_name = 'supervisor_letters' AND column_name = 'gender') OR (table_name = 'family_documents' AND column_name IN ('file_name','file_size','notes','doc_type')))")
          user_management_departments=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM departments WHERE name_en IN ('General Management','Mothers Affairs','Lost & Found','Social Media','Sponsor Affairs','Accounting & Finance')")
          user_management_roles=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM roles WHERE code IN ('financial_manager','accountant_staff','nanny','administration','social_media')")
          test "$user_management_columns" = "9"
          test "$user_management_departments" = "6"
          test "$user_management_roles" = "5"
          accounting_core_tables=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('accounts','journal_entries','journal_lines','vouchers','project_beneficiaries','accounting_admin_fee_policies')")
          accounting_core_columns=$(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND ((table_name = 'other_projects' AND column_name IN ('revenue_account_id','expense_account_id')) OR (table_name = 'transactions' AND column_name IN ('admin_fee_method','admin_fee_value','admin_fee_policy_id')) OR (table_name = 'sponsor_payments' AND column_name = 'payment_method'))")
          test "$accounting_core_tables" = "6"
          test "$accounting_core_columns" = "6"
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-20_hr_fm_payroll_transfer_workflow.sql
          # Exercise the mobile bearer-session migration on the disposable full schema.
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-24_mobile_api_sessions.sql
          # The migration must be safely repeatable on the same schema.
          mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test < database/migrations/2026-10-24_mobile_api_sessions.sql

      - name: Apply migration and verify full schema backfill
        env:
          SALARY_ADVANCE_MIGRATION_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: salary_advance_migration_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php tools/test_salary_advance_rescheduling_full_schema.php

      - name: Run rollback-only Stage 5 payroll regressions and account 1410 reconciliation
        env:
          AHL_ENV: development
          AHL_DB_HOST: 127.0.0.1
          AHL_DB_PORT: '3306'
          AHL_DB_NAME: salary_advance_migration_test
          AHL_DB_USER: root
          AHL_DB_PASS: root
        run: |
          set -euo pipefail
          php tools/run_salary_advance_stage5_schedule_tests.php
          php tools/run_salary_advance_stage5_payroll_tests.php
          php tools/run_salary_advance_stage5_payroll_edge_tests.php
          php tools/run_salary_advance_1410_reconciliation.php
          php tools/test_salary_advance_rescheduling_payroll_concurrency.php
          php tools/test_mobile_api_suspension_service.php
          php tools/test_mobile_admin_departments_service.php
          php tools/test_mobile_admin_recovery_service.php
          php tools/test_mobile_transactions_date_filter.php
          php tools/test_mobile_role_dashboard_queries.php
          php tools/test_mobile_sponsor_assignment_service.php
          php tools/test_mobile_supervisor_status_service.php

      - name: Verify user-management migration restores legacy schema shape
        env:
          MYSQL_PWD: root
        shell: bash
        run: |
          set -euo pipefail
          mysql=(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test)
          # Simulate the pre-cleanup shape only after the full-schema regression harnesses have finished.
          "${mysql[@]}" -e "ALTER TABLE users DROP COLUMN department_id, DROP COLUMN manager_id"
          "${mysql[@]}" -e "ALTER TABLE sponsors DROP COLUMN gender"
          "${mysql[@]}" -e "ALTER TABLE families DROP COLUMN nanny_id"
          "${mysql[@]}" -e "DROP TABLE family_documents, accountant_nanny_assignments"
          "${mysql[@]}" < database/migrations/2026-10-28_user_management_runtime_schema_cleanup.sql
          "${mysql[@]}" < database/migrations/2026-10-28_user_management_runtime_schema_cleanup.sql
          legacy_columns=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND ((table_name = 'users' AND column_name IN ('department_id','manager_id')) OR (table_name = 'sponsors' AND column_name = 'gender') OR (table_name = 'families' AND column_name = 'nanny_id') OR (table_name = 'supervisor_letters' AND column_name = 'gender') OR (table_name = 'family_documents' AND column_name IN ('file_name','file_size','notes','doc_type')))")
          restored_tables=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('departments','family_documents','accountant_nanny_assignments')")
          restored_index=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema = DATABASE() AND table_name = 'supervisor_letters' AND index_name = 'uq_supervisor_letter_gender'")
          test "$legacy_columns" = "9"
          test "$restored_tables" = "3"
          test "$restored_index" = "1"

      - name: Verify family schema migration restores legacy schema shape
        env:
          MYSQL_PWD: root
        shell: bash
        run: |
          set -euo pipefail
          mysql=(mysql --host=127.0.0.1 --port=3306 --user=root --database=salary_advance_migration_test)
          # Simulate the pre-cleanup family schema only after existing regression harnesses have finished.
          "${mysql[@]}" -e "ALTER TABLE family_children DROP INDEX uq_family_children_form_serial, DROP COLUMN form_serial, DROP COLUMN national_id, DROP COLUMN nationality, DROP COLUMN health_status, DROP COLUMN health_status_other, DROP COLUMN psychological_state, DROP COLUMN psychological_state_other, DROP COLUMN guardian_name, DROP COLUMN guardian_relationship, DROP COLUMN photo_path, DROP COLUMN monthly_sponsorship_value, DROP COLUMN extra_allowance"
          "${mysql[@]}" -e "ALTER TABLE families DROP COLUMN father_name, DROP COLUMN father_death_date, DROP COLUMN father_death_cause, DROP COLUMN mother_marital_status"
          "${mysql[@]}" -e "DROP TABLE family_bank_accounts, orphan_documents"
          "${mysql[@]}" < database/migrations/2026-10-28_family_runtime_schema_cleanup.sql
          "${mysql[@]}" < database/migrations/2026-10-28_family_runtime_schema_cleanup.sql
          family_columns=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND ((table_name = 'families' AND column_name IN ('father_name','father_death_date','father_death_cause','mother_marital_status')) OR (table_name = 'family_children' AND column_name IN ('national_id','nationality','health_status','health_status_other','psychological_state','psychological_state_other','guardian_name','guardian_relationship','photo_path','form_serial','monthly_sponsorship_value','extra_allowance')))")
          family_tables=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('family_bank_accounts','orphan_documents')")
          family_index=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema = DATABASE() AND table_name = 'family_children' AND index_name = 'uq_family_children_form_serial'")
          test "$family_columns" = "16"
          test "$family_tables" = "2"
          test "$family_index" = "1"

      - name: Verify accounting core migration creates missing schema
        env:
          MYSQL_PWD: root
        shell: bash
        run: |
          set -euo pipefail
          mysql=(mysql --host=127.0.0.1 --port=3306 --user=root)
          "${mysql[@]}" -e "CREATE DATABASE accounting_core_migration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          "${mysql[@]}" --database=accounting_core_migration_test -e "CREATE TABLE other_projects (id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY) ENGINE=InnoDB; CREATE TABLE transactions (id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY) ENGINE=InnoDB; CREATE TABLE sponsor_payments (id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY) ENGINE=InnoDB"
          "${mysql[@]}" --database=accounting_core_migration_test < database/migrations/2026-10-28_accounting_core_runtime_schema_cleanup.sql
          "${mysql[@]}" --database=accounting_core_migration_test < database/migrations/2026-10-28_accounting_core_runtime_schema_cleanup.sql
          accounting_tables=$("${mysql[@]}" --database=accounting_core_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('accounts','journal_entries','journal_lines','vouchers','project_beneficiaries','accounting_admin_fee_policies')")
          accounting_columns=$("${mysql[@]}" --database=accounting_core_migration_test --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND ((table_name = 'other_projects' AND column_name IN ('revenue_account_id','expense_account_id')) OR (table_name = 'transactions' AND column_name IN ('admin_fee_method','admin_fee_value','admin_fee_policy_id')) OR (table_name = 'sponsor_payments' AND column_name = 'payment_method'))")
          test "$accounting_tables" = "6"
          test "$accounting_columns" = "6"

  hr-job-description-migrations:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hr_job_description_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Import checked-in schema
        env:
          MYSQL_PWD: root
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --database=hr_job_description_migration_test < database/ahl_el_kheir.sql

      - name: Apply HR catalogue migration sequence and verify approved-record preservation
        env:
          MYSQL_PWD: root
        shell: bash
        run: |
          set -euo pipefail
          mysql=(mysql --host=127.0.0.1 --port=3306 --user=root --database=hr_job_description_migration_test)

          # The checked-in schema is already the post-migration shape. Recreate
          # the pre-role-catalogue table only in this disposable CI database so
          # the historical migration sequence runs from its intended starting shape.
          "${mysql[@]}" -e "DROP TABLE IF EXISTS hr_job_description_templates"
          "${mysql[@]}" < database/migrations/2026-10-20_hr_job_description_catalogue.sql

          # Build a CI-only approved-record fixture with intentionally blank fields.
          # Proposal/backfill migrations must leave its status and content unchanged.
          "${mysql[@]}" <<'SQL'
          SET NAMES utf8mb4;
          INSERT INTO hr_job_description_templates
              (position_title, description_status, is_active, created_at, updated_at)
          SELECT 'مدير الموارد البشرية', 'approved', 1, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          WHERE NOT EXISTS (
              SELECT 1 FROM hr_job_description_templates
              WHERE position_title = 'مدير الموارد البشرية'
          );
          UPDATE hr_job_description_templates
          SET description_status = 'approved',
              role_purpose = NULL,
              responsibilities = NULL,
              qualifications = NULL,
              reporting_to = NULL,
              is_active = 1
          WHERE position_title = 'مدير الموارد البشرية';
          SQL

          for migration in \
            database/migrations/2026-10-20_hr_job_description_proposals.sql \
            database/migrations/2026-10-20_hr_job_description_system_roles.sql \
            database/migrations/2026-10-20_hr_job_description_z_clear_unreviewed_generic_drafts.sql \
            database/migrations/2026-10-20_hr_job_description_zz_role_qualifications.sql \
            database/migrations/2026-10-20_hr_job_description_zz_role_qualifications_utf8_repair.sql \
            database/migrations/2026-10-20_hr_job_description_zzz_general_fallback_drafts.sql \
            database/migrations/2026-10-20_hr_job_description_zzzz_qualification_baseline.sql
          do
            "${mysql[@]}" < "$migration"
          done

          approved_guard=$("${mysql[@]}" --batch --skip-column-names -e "
            SELECT IF(
              COUNT(*) = 1
              AND SUM(description_status = 'approved'
                      AND role_purpose IS NULL
                      AND responsibilities IS NULL
                      AND qualifications IS NULL
                      AND reporting_to IS NULL
                      AND is_active = 1) = 1,
              1, 0)
            FROM hr_job_description_templates
            WHERE position_title = 'مدير الموارد البشرية'
              AND system_role_code = '';
          ")
          test "$approved_guard" = "1"

