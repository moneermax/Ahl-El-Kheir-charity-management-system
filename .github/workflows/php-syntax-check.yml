name: Salary advance verification

on:
  push:
    branches: [main]
    paths:
      - 'api/v1/**'
      - 'modules/**'
      - 'tools/**'
      - 'config/**'
      - 'database/**'
      - 'lang/**'
      - 'assets/**'
      - '*.php'
      - '*.sql'
      - '.htaccess'
      - 'composer.json'
      - '.github/workflows/php-syntax-check.yml'
  pull_request:
    paths:
      - 'api/v1/**'
      - 'modules/**'
      - 'tools/**'
      - 'config/**'
      - 'database/**'
      - 'lang/**'
      - 'assets/**'
      - '*.php'
      - '*.sql'
      - '.htaccess'
      - 'composer.json'
      - '.github/workflows/php-syntax-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Lint selected PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            api/v1/_bootstrap.php
            api/v1/auth/login.php
            api/v1/auth/logout.php
            api/v1/auth/me.php
            api/v1/notifications/index.php
            api/v1/notifications/mark_read.php
            api/v1/projects/index.php
            api/v1/projects/detail.php
            api/v1/projects/progress_update.php
            api/v1/projects/milestone_create.php
            api/v1/projects/milestone_action.php
            api/v1/hr/attendance.php
            api/v1/hr/attendance_policy.php
            api/v1/hr/employee_detail.php
            api/v1/hr/my_salary_statements.php
            api/v1/hr/employment_states.php
            api/v1/hr/payroll_integrity.php
            api/v1/hr/gm_payroll_period_history.php
            api/v1/hr/gm_payroll_period_report.php
            api/v1/hr/salary_advance_waiver.php
            api/v1/nanny/group_verification.php
            api/v1/nanny/group_verification_action.php
            api/v1/nanny/pre_verification.php
            api/v1/nanny/pre_verification_action.php
            api/v1/hr/employees.php
            api/v1/hr/leaves.php
            api/v1/hr/leaves/action.php
            api/v1/sponsors/index.php
            tools/test_mobile_sponsor_assignment_service.php
            api/v1/sponsors/assign.php
            api/v1/sponsors/assignment_options.php
            api/v1/sponsors/assignment_service.php
            api/v1/supervisors/index.php
            tools/test_mobile_supervisor_status_service.php
            api/v1/supervisors/action.php
            api/v1/supervisors/action_service.php
            api/v1/sponsors/detail.php
            api/v1/sponsor_requests/index.php
            api/v1/sponsor_requests/action.php
            api/v1/families/index.php
            api/v1/families/detail.php
            api/v1/families/orphan_forms.php
            api/v1/families/orphan_form.php
            api/v1/age_alerts/index.php
            api/v1/age_alerts/suspend_child.php
            api/v1/age_alerts/suspension_service.php
            api/v1/suspensions/index.php
            api/v1/suspensions/lift.php
            api/v1/suspensions/case_service.php
            api/v1/admin/overview.php
            api/v1/admin/finance_overview.php
            api/v1/admin/accounts.php
            api/v1/admin/accounts_action.php
            api/v1/admin/accounts_service.php
            api/v1/admin/settings.php
            api/v1/reports/orphaned_families.php
            api/v1/reports/overview.php
            api/v1/reports/detail.php
            api/v1/audit/index.php
            api/v1/admin/users.php
            api/v1/admin/departments.php
            api/v1/admin/departments_action.php
            api/v1/admin/departments_service.php
            tools/test_mobile_admin_departments_service.php
            api/v1/admin/recovery.php
            api/v1/admin/recovery_action.php
            api/v1/admin/recovery_service.php
            tools/test_mobile_admin_recovery_service.php
            api/v1/admin/users_action.php
            api/v1/admin/users_action_service.php
            tools/test_mobile_admin_users_action_service.php
            api/v1/dashboard/overview.php
            api/v1/dashboard/overview_service.php
            api/v1/transactions/index.php
            api/v1/accounting/fm_review_queue.php
            api/v1/accounting/fm_review_queue_action.php
            api/v1/accounting/vouchers.php
            api/v1/sponsorships/index.php
            api/v1/sponsorships/detail.php
            api/v1/account/avatar.php
            api/v1/account/profile.php
            api/v1/accounting/accounts.php
            api/v1/accounting/assigned_nannies.php
            api/v1/accounting/fm_transaction_receipt.php
            api/v1/accounting/fm_transaction_review.php
            api/v1/accounting/gm_reconciliation.php
            api/v1/accounting/journal.php
            api/v1/accounting/trial_balance.php
            api/v1/admin/backups.php
            api/v1/admin/database.php
            api/v1/admin/disbursements.php
            api/v1/admin/disbursements_action.php
            api/v1/administration/available_families.php
            api/v1/administration/winback.php
            api/v1/auth/change_password.php
