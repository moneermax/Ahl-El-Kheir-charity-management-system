name: Apply disbursement authorization hardening fix
on:
  push:
    paths:
      - '.github/workflows/_apply_disbursement_auth_fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate disbursements.php
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('modules/accounting/disbursements.php')
          s = p.read_text(encoding='utf-8')
          original = s
          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              s = s.replace(old, new, 1)
          once(
              "$canManage = in_array($role, ['admin','general_manager','financial_manager','accountant', 'accountant_staff'], true);",
              "$isAccountantStaff = ($role === 'accountant_staff');\n$canManage = in_array($role, ['admin','general_manager','financial_manager','accountant'], true);\n$canManageAssigned = $canManage || $isAccountantStaff;",
              'role permissions'
          )
          once("if (!$isNanny && !$canManage) {", "if (!$isNanny && !$canManageAssigned) {", 'access guard')
          once("if ($canManage && isset($_POST['create_batch'])) {", "if ($canManageAssigned && isset($_POST['create_batch'])) {", 'create guard')
          once(
              """                if ((int)$groupData['verified_families'] === 0) {
                      $skipped++;
                      $skip_reasons[] = \"المجموعة ID {$gid}: لا توجد عائلات موثقة بالكامل (3 خانات) لهذا الشهر.\";
                      continue;
                  }""",
              """                if ($isAccountantStaff && !dbFetchOne(\"SELECT 1 FROM accountant_nanny_assignments WHERE accountant_id = ? AND nanny_id = ?\", [$uid, (int)$groupData['nanny_id']])) {
                      $skipped++;
                      $skip_reasons[] = \"المجموعة ID {$gid}: ليست ضمن المجموعات المسندة إليك.\";
                      continue;
                  }
                  if ((int)$groupData['verified_families'] === 0) {
                      $skipped++;
                      $skip_reasons[] = \"المجموعة ID {$gid}: لا توجد عائلات موثقة بالكامل (3 خانات) لهذا الشهر.\";
                      continue;
                  }""",
              'create assignment check'
          )
          once("if ($canManage && isset($_POST['reopen_batch'])) {", "if ($canManageAssigned && isset($_POST['reopen_batch'])) {", 'reopen batch guard')
          once(
              """        if (!$b || !in_array($b['status'], ['received', 'returned'], true)) {
            flash('error', 'لا يمكن إعادة فتح هذه الدفعة من حالتها الحالية.');
        } elseif ($reason === '') {""",
              """        if (!$b || !in_array($b['status'], ['received', 'returned'], true)) {
            flash('error', 'لا يمكن إعادة فتح هذه الدفعة من حالتها الحالية.');
        } elseif ($isAccountantStaff && !dbFetchOne(\"SELECT 1 FROM accountant_nanny_assignments WHERE accountant_id = ? AND nanny_id = ?\", [$uid, (int)$b['nanny_id']])) {
            flash('error', 'هذه الدفعة ليست ضمن الدفعات المسندة إليك.');
        } elseif ($reason === '') {""",
              'reopen batch assignment check'
          )
          once("if ($canManage && isset($_POST['reopen_item'])) {", "if ($canManageAssigned && isset($_POST['reopen_item'])) {", 'reopen item guard')
          once(
              "SELECT i.*, d.id AS disbursement_id, d.status AS dstatus, d.group_id, d.month",
              "SELECT i.*, d.id AS disbursement_id, d.nanny_id, d.status AS dstatus, d.group_id, d.month",
              'reopen item nanny id'
          )
          once(
              """        if (!$item || !in_array($item['status'], ['paid', 'returned'], true)) {
            flash('error', 'لا يمكن إعادة فتح هذا السجل من حالته الحالية.');
        } elseif ($reason === '') {""",
              """        if (!$item || !in_array($item['status'], ['paid', 'returned'], true)) {
            flash('error', 'لا يمكن إعادة فتح هذا السجل من حالته الحالية.');
        } elseif ($isAccountantStaff && !dbFetchOne(\"SELECT 1 FROM accountant_nanny_assignments WHERE accountant_id = ? AND nanny_id = ?\", [$uid, (int)$item['nanny_id']])) {
            flash('error', 'هذا السجل ليس ضمن الدفعات المسندة إليك.');
        } elseif ($reason === '') {""",
              'reopen item assignment check'
          )
          once("if ($canManage) {\n    // Shared default month", "if ($canManageAssigned) {\n    // Shared default month", 'group loading guard')
          once("($canManage && $anyReopenableItem)", "($canManageAssigned && $anyReopenableItem)", 'item action column')
          once("elseif ($canManage && in_array($it['status'], ['paid', 'returned'], true))", "elseif ($canManageAssigned && in_array($it['status'], ['paid', 'returned'], true))", 'item reopen ui')
          once("if ($canManage && in_array($viewBatch['status'], ['received', 'returned']))", "if ($canManageAssigned && in_array($viewBatch['status'], ['received', 'returned']))", 'batch reopen ui')
          once("if ($canManage && !$viewId)", "if ($canManageAssigned && !$viewId)", 'create ui')
          old = """    WHERE og.verification_status IN ('submitted', 'approved', 'pending')
    GROUP BY og.id, og.group_name, u.full_name, nga.nanny_id"""
          new = """    WHERE og.verification_status IN ('submitted', 'approved', 'pending')
      AND (
          ? = 0
          OR EXISTS (
              SELECT 1
              FROM accountant_nanny_assignments ana
              WHERE ana.accountant_id = ?
                AND ana.nanny_id = nga.nanny_id
          )
      )
    GROUP BY og.id, og.group_name, u.full_name, nga.nanny_id"""
          once(old, new, 'group assignment filter')
          once("    \", [$previewMonth]);", "    \", [$previewMonth, $isAccountantStaff ? $uid : 0, $isAccountantStaff ? $uid : 0]);", 'group query params')
          # Existing direct-access assignment check is retained; no change needed.
          # Harden account-column references used by the return-reversal path.
          once(
              "SELECT jl.account_id, a.code, a.name",
              "SELECT jl.account_id, a.code",
              'return expense account select'
          )
          once(
              "SELECT id, code, name FROM accounts WHERE code = ? LIMIT 1",
              "SELECT id, code FROM accounts WHERE code = ? LIMIT 1",
              'return fallback account select'
          )
          once(
              "SELECT id, code, name FROM accounts WHERE code = '1100' LIMIT 1",
              "SELECT id, code FROM accounts WHERE code = '1100' LIMIT 1",
              'return cash account select'
          )
          if s == original:
              raise SystemExit('No changes produced')
          p.write_text(s, encoding='utf-8')
          PY
          php -l modules/accounting/disbursements.php
      - name: Commit patched file and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/accounting/disbursements.php
          git rm .github/workflows/_apply_disbursement_auth_fix.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Fix disbursement authorization boundaries'
          git push origin HEAD:main