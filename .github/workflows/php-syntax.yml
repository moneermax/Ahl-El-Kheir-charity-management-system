name: PHP syntax validation

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '.github/workflows/php-syntax.yml'
  pull_request:
    paths:
      - '**/*.php'
      - '.github/workflows/php-syntax.yml'

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathai/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Lint PHP source files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' -print0)
          echo "Successfully syntax-checked $count PHP files."
