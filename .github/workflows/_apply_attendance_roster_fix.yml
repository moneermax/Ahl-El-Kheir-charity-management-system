name: Apply attendance roster fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch attendance page
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('modules/hr/attendance.php'); s=p.read_text(encoding='utf-8'); css='''\n.att5-leave-roster{margin:0 0 12px;background:#f8fbfd;border:1px solid #dbeaf2;border-radius:10px;padding:10px 12px}.att5-leave-roster-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.att5-leave-roster-title{font-size:.75rem;font-weight:800;color:#126c8e}.att5-leave-roster-count{font-size:.65rem;color:#667085}.att5-leave-roster-list{display:flex;flex-wrap:wrap;gap:6px}.att5-leave-chip{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #e1e8ed;border-radius:8px;padding:6px 8px}.att5-leave-chip-name{font-size:.68rem;font-weight:800;color:#344054}.att5-leave-chip-date{font-size:.6rem;color:#98a2b3}.att5-leave-chip .att5-row-btn{height:27px}\n'''; s=s.replace('</style>',css+'</style>',1) if '.att5-leave-roster{' not in s else s; marker=\"document.addEventListener('DOMContentLoaded', function(){\\n    const body=document.getElementById('att5Body');\"; inject=\"document.addEventListener('DOMContentLoaded', function(){\\n    const body=document.getElementById('att5Body');\\n    const leaveRows=Array.from(body.querySelectorAll('tr[data-status=\\\"on_leave\\\"]'));\\n    if(leaveRows.length){const panel=document.createElement('div');panel.className='att5-leave-roster';panel.innerHTML='<div class=\\\"att5-leave-roster-head\\\"><span class=\\\"att5-leave-roster-title\\\"><i class=\\\"fas fa-calendar-day\\\"></i> موظفون في إجازة معتمدة</span><span class=\\\"att5-leave-roster-count\\\">لن يظهروا في كشف الحضور حتى تسجيل العودة</span></div><div class=\\\"att5-leave-roster-list\\\"></div>';const list=panel.querySelector('.att5-leave-roster-list');leaveRows.forEach(row=>{const name=row.querySelector('.att5-name')?.textContent?.trim()||'موظف';const date=row.querySelector('.att5-leave-note')?.textContent?.trim()||'';const form=row.querySelector('.att5-return-form');const chip=document.createElement('div');chip.className='att5-leave-chip';const info=document.createElement('div');info.innerHTML='<div class=\\\"att5-leave-chip-name\\\"></div><div class=\\\"att5-leave-chip-date\\\"></div>';info.querySelector('.att5-leave-chip-name').textContent=name;info.querySelector('.att5-leave-chip-date').textContent=date;chip.appendChild(info);if(form)chip.appendChild(form);list.appendChild(chip);row.style.display='none';});const table=body.closest('.att5-table');if(table)table.parentNode.insertBefore(panel,table);}\"; s=s.replace(marker,inject,1) if 'att5-leave-roster-title' not in s else s; old=\"const filter=()=>{\\n        const q=(search.value||'').trim().toLowerCase(), d=dept.value, s=status.value;\\n        body.querySelectorAll('tr').forEach(r=>{\\n            if(!r.querySelector('.att5-employee')) return;\\n            const n=(r.dataset.name||'').toLowerCase(), rd=r.dataset.dept||'', rs=r.dataset.status||'';\\n            r.style.display=(!q||n.includes(q))&&(!d||rd===d)&&(!s||rs===s)?'':'none';\\n        });\\n        refresh();\\n    };\"; new=\"const filter=()=>{\\n        const q=(search.value||'').trim().toLowerCase(), d=dept.value, s=status.value;\\n        body.querySelectorAll('tr').forEach(r=>{\\n            if(!r.querySelector('.att5-employee')) return;\\n            const n=(r.dataset.name||'').toLowerCase(), rd=r.dataset.dept||'', rs=r.dataset.status||'';\\n            const isLeave=rs==='on_leave';\\n            r.style.display=(!isLeave&&(!q||n.includes(q))&&(!d||rd===d)&&(!s||rs===s))?'':'none';\\n        });\\n        refresh();\\n    };\"; s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')"
          git add modules/hr/attendance.php
          git diff --cached --quiet || git commit -m "Hide approved-leave employees from attendance roster"
          git push