name: Apply header search redesign now

on:
  push:
    paths:
      - '.github/workflows/fix-header-search-now.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace header search block
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('includes/header.php')
          s = p.read_text(encoding='utf-8')
          start = s.find('            <!-- =========================================================\n                 SEARCH\n                 ========================================================= -->')
          if start < 0:
              raise SystemExit('SEARCH marker not found')
          end_marker = '        </div>\n        <!-- END header-sticky-wrapper -->'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('sticky wrapper end not found')
          replacement = '''            <!-- =========================================================\n                 GLOBAL SEARCH ENTRY\n                 ========================================================= -->\n\n            <?php if ($canGlobalSearch): ?>\n                <div class="global-search-entry-bar">\n                    <a\n                        href="<?php echo APP_URL; ?>modules/search/index.php"\n                        class="global-search-entry"\n                        aria-label="<?php echo AK_LANG === 'ar' ? 'فتح البحث العام' : 'Open global search'; ?>"\n                    >\n                        <i class="fas fa-search"></i>\n                        <span><?php echo AK_LANG === 'ar' ? 'البحث' : 'Search'; ?></span>\n                    </a>\n                </div>\n            <?php endif; ?>\n\n'''
          s = s[:start] + replacement + s[end:]
          # Remove all legacy search CSS/rules, regardless of their current formatting.
          s = re.sub(r'\\n\\s*\\.ak-search-bar-wrap\\s*\\{.*?(?=\\n\\s*@media|\\n\\s*body\\.theme-dark|\\n\\s*</style>)', '\\n', s, count=1, flags=re.S)
          s = re.sub(r'\\n\\s*body\\.theme-dark\\s*\\.ak-search-bar-wrap\\s*\\{.*?(?=\\n\\s*</style>)', '\\n', s, count=1, flags=re.S)
          # Remove any search-specific CSS left in the file.
          s = re.sub(r'\\n\\s*\\.ak-search-form[^}]*\\}\\s*', '\\n', s, flags=re.S)
          s = re.sub(r'\\n\\s*body\\.theme-dark\\s*\\.ak-search-form[^}]*\\}\\s*', '\\n', s, flags=re.S)
          # Add definitive compact-entry CSS before </style>.
          css = '''\n        .global-search-entry-bar {\n            display: flex;\n            justify-content: flex-end;\n            align-items: center;\n            padding: 6px 15px;\n            background: var(--navy);\n            border-top: 1px solid rgba(255,255,255,.08);\n        }\n        .global-search-entry {\n            display: inline-flex;\n            align-items: center;\n            gap: 6px;\n            min-height: 30px;\n            padding: 4px 11px;\n            border: 1px solid rgba(255,255,255,.25);\n            border-radius: 5px;\n            background: rgba(255,255,255,.12);\n            color: #fff !important;\n            text-decoration: none;\n            font-size: .72rem;\n            font-weight: 600;\n            white-space: nowrap;\n        }\n        .global-search-entry:hover { background: rgba(255,255,255,.22); color:#fff !important; }\n'''
          if '.global-search-entry {' not in s:
              s = s.replace('    </style>', css + '    </style>', 1)
          # Hard validation: none of the old controls may remain in header.php.
          forbidden = ['ak-search-bar-wrap', 'ak-search-form', 'globalSearchForm', 'id="searchType"', 'id="searchQuery"', 'id="searchStatus"', 'id="searchMonth"']
          found = [x for x in forbidden if x in s]
          if found:
              raise SystemExit('legacy search controls remain: ' + ', '.join(found))
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Commit result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/header.php
          git diff --cached --check
          git diff --cached --quiet || git commit -m "fix: replace header search with dedicated search button"
          git rm -f .github/workflows/fix-header-search-now.yml .github/workflows/apply-search-redesign-v2.yml .github/workflows/apply-search-redesign.yml 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: remove temporary search workflows"
          git push