name: Sponsorship Monthly Agreements Migration

on:
  push:
    branches: [main]
    paths:
      - 'database/ahl_el_kheir.sql'
      - 'database/migrations/2026-11-12_sponsorship_monthly_agreements.sql'
      - 'database/migrations/2026-11-12_sponsorship_service_fee_account_mapping.sql'
      - 'tools/sync_sponsorship_monthly_agreements_schema.py'
      - 'tools/sync_sponsorship_service_fee_mapping_schema.py'
      - '.github/workflows/sponsorship-monthly-agreements-migration.yml'
  pull_request:
    paths:
      - 'database/ahl_el_kheir.sql'
      - 'database/migrations/2026-11-12_sponsorship_monthly_agreements.sql'
      - 'database/migrations/2026-11-12_sponsorship_service_fee_account_mapping.sql'
      - '.github/workflows/sponsorship-monthly-agreements-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sponsorship_agreement_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Validate and synchronize canonical schema representation (repeatability check, key-safe)
        run: |
          python3 -m py_compile tools/sync_sponsorship_monthly_agreements_schema.py
          python3 tools/sync_sponsorship_monthly_agreements_schema.py
          python3 tools/sync_sponsorship_monthly_agreements_schema.py
          python3 -m py_compile tools/sync_sponsorship_service_fee_mapping_schema.py
          python3 tools/sync_sponsorship_service_fee_mapping_schema.py
          python3 tools/sync_sponsorship_service_fee_mapping_schema.py

      - name: Commit canonical schema synchronization to main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- database/ahl_el_kheir.sql; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add database/ahl_el_kheir.sql
            git commit -m "chore: synchronize canonical sponsorship agreement schema"
            git push origin HEAD:main
          fi

      - name: Import canonical schema and apply migration twice
        env:
          MYSQL_PWD: root
        shell: bash
        run: |
          set -euo pipefail
          mysql=(mysql --host=127.0.0.1 --port=3306 --user=root --database=sponsorship_agreement_migration_test)
          "${mysql[@]}" < database/ahl_el_kheir.sql

          before_transactions=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM transactions")
          before_sponsor_payments=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM sponsor_payments")

          "${mysql[@]}" < database/migrations/2026-11-12_sponsorship_monthly_agreements.sql
          "${mysql[@]}" < database/migrations/2026-11-12_sponsorship_monthly_agreements.sql
          "${mysql[@]}" < database/migrations/2026-11-12_sponsorship_service_fee_account_mapping.sql
          "${mysql[@]}" < database/migrations/2026-11-12_sponsorship_service_fee_account_mapping.sql

          after_transactions=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM transactions")
          after_sponsor_payments=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM sponsor_payments")
          legacy_transactions=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM transactions WHERE component_model='legacy' AND monthly_agreement_id IS NULL AND agreed_sponsorship_amount IS NULL AND agreed_service_fee_amount IS NULL AND actual_sponsorship_received IS NULL AND actual_service_fee_received IS NULL")
          legacy_sponsor_payments=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM sponsor_payments WHERE component_model='legacy' AND monthly_agreement_id IS NULL AND agreed_sponsorship_amount IS NULL AND agreed_service_fee_amount IS NULL AND actual_sponsorship_received IS NULL AND actual_service_fee_received IS NULL")
          agreement_table=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='sponsorship_monthly_agreements'")
          snapshot_columns=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name IN ('transactions','sponsor_payments') AND column_name IN ('component_model','monthly_agreement_id','agreed_sponsorship_amount','agreed_service_fee_amount','actual_sponsorship_received','actual_service_fee_received')")
          service_fee_columns=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='transactions' AND column_name IN ('service_fee_account_mapping_id','service_fee_account_id')")
          service_fee_mapping_table=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='sponsorship_service_fee_account_mappings'")
          agreement_fks=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema=DATABASE() AND constraint_name IN ('fk_spma_sponsorship','fk_spma_currency','fk_spma_creator','fk_transactions_spma','fk_sponsor_payments_spma')")
          service_fee_fks=$("${mysql[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema=DATABASE() AND constraint_name IN ('fk_ssfam_account','fk_ssfam_creator','fk_transactions_ssfam_mapping','fk_transactions_ssfam_account')")
          agreement_checks=$(${mysql[@]} --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.CHECK_CONSTRAINTS WHERE CONSTRAINT_SCHEMA=DATABASE() AND TABLE_NAME='sponsorship_monthly_agreements'")
          test "$before_transactions" = "$after_transactions"
          test "$before_sponsor_payments" = "$after_sponsor_payments"
          test "$legacy_transactions" = "$after_transactions"
          test "$legacy_sponsor_payments" = "$after_sponsor_payments"
          test "$agreement_table" = "1"
          test "$snapshot_columns" = "12"
          test "$service_fee_columns" = "2"
          test "$service_fee_mapping_table" = "1"
          test "$agreement_fks" = "5"
          test "$service_fee_fks" = "4"
          test "$agreement_checks" = "2"
